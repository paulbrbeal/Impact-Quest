<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impact Quest — Story Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f0e8;--surface:#ffffff;--surface-alt:#faf8f4;--border:#d8d2c4;--border-light:#e8e3d9;
  --text:#0f0e0d;--text-sec:#4a4540;--text-muted:#8c8272;
  --accent:#e8963a;--accent-dark:#c4782a;--accent-glow:rgba(232,150,58,0.1);
  --ink:#0f0e0d;--sage:#4a6741;--sage-light:#e8f0e5;--rust:#c0392b;--rust-light:#fdeeed;
  --blue:#5b7fb5;--blue-light:#eaf0f7;
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
button{font-family:inherit;cursor:pointer}input,textarea,select{font-family:inherit}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:260px;background:var(--ink);color:#c8bfaa;display:flex;flex-direction:column;flex-shrink:0}
.main{flex:1;overflow-y:auto;padding:24px 32px 80px}

/* Sidebar */
.sidebar-header{padding:16px;border-bottom:1px solid #2a2826}
.logo{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;color:#f5f0e8}
.logo em{color:var(--accent);font-style:normal}
.sidebar-stats{padding:12px 16px;border-bottom:1px solid #2a2826;display:flex;gap:12px;flex-wrap:wrap}
.stat{text-align:center;flex:1;min-width:50px}
.stat-num{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--accent);letter-spacing:1px;line-height:1}
.stat-lbl{font-size:8px;text-transform:uppercase;letter-spacing:1.5px;color:#6b6459;margin-top:2px}
.sidebar-actions{padding:12px 16px;border-bottom:1px solid #2a2826;display:flex;flex-wrap:wrap;gap:6px}
.sb-btn{background:#1a1917;border:1px solid #2a2826;color:#c8bfaa;padding:5px 10px;border-radius:3px;font-size:10px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;transition:all 0.15s}
.sb-btn:hover{border-color:var(--accent);color:var(--accent)}
.sb-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--ink)}.sb-btn.primary:hover{background:var(--accent-dark)}
.sidebar-nav{padding:8px 16px;border-bottom:1px solid #2a2826;display:flex;gap:0}
.nav-tab{flex:1;padding:6px;font-size:10px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;background:transparent;color:#6b6459;border:none;border-bottom:2px solid transparent;transition:all 0.15s;text-align:center}
.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.nav-tab:hover:not(.active){color:#c8bfaa}
.sidebar-search{padding:8px 16px}
.sidebar-search input{width:100%;background:#1a1917;border:1px solid #2a2826;color:#c8bfaa;padding:6px 10px;border-radius:3px;font-size:12px;outline:none}
.sidebar-search input:focus{border-color:var(--accent)}
.sidebar-search input::placeholder{color:#4a4540}
.scene-list{flex:1;overflow-y:auto;padding:4px 0}
.scene-item{padding:6px 16px;cursor:pointer;border-left:3px solid transparent;transition:all 0.1s;display:flex;align-items:center;gap:8px}
.scene-item:hover{background:#1a1917}
.scene-item.active{background:#1a1917;border-left-color:var(--accent)}
.scene-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.scene-item .info{flex:1;min-width:0}
.scene-item .title{font-size:12px;font-weight:500;color:#c8bfaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scene-item.active .title{color:#f5f0e8}
.scene-item .meta{font-size:9px;color:#4a4540;font-family:monospace;margin-top:1px}
.badge{font-size:7px;padding:1px 4px;border-radius:2px;font-weight:800;letter-spacing:0.5px;flex-shrink:0}
/* Story item in sidebar */
.story-item{padding:8px 16px;cursor:pointer;border-left:3px solid transparent;transition:all 0.1s}
.story-item:hover{background:#1a1917}
.story-item.active{background:#1a1917;border-left-color:var(--accent)}
.story-item .s-title{font-size:12px;font-weight:600;color:#c8bfaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story-item.active .s-title{color:#f5f0e8}
.story-item .s-meta{font-size:9px;color:#4a4540;margin-top:2px}

/* Main header */
.main-header{margin-bottom:24px;display:flex;justify-content:space-between;align-items:flex-start}
.main-title{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:3px;color:var(--ink)}
.main-title em{font-style:normal;color:var(--accent)}
.view-tabs{display:flex;gap:0;border:1px solid var(--border);border-radius:3px;overflow:hidden}
.view-tab{padding:6px 16px;font-size:11px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;background:var(--surface);color:var(--text-muted);border:none;transition:all 0.15s}
.view-tab:not(:last-child){border-right:1px solid var(--border)}
.view-tab.active{background:var(--ink);color:var(--bg)}.view-tab:hover:not(.active){background:var(--surface-alt)}

/* Scene card */
.scene-card{background:var(--surface);border:1px solid var(--border);border-radius:3px;margin-bottom:16px;overflow:hidden;transition:border-color 0.15s}
.scene-card.expanded{border-color:var(--accent)}
.scene-card-header{padding:14px 18px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:background 0.1s}
.scene-card-header:hover{background:var(--surface-alt)}
.scene-card .expand-arrow{color:var(--text-muted);font-size:11px;transition:transform 0.2s;flex-shrink:0}
.scene-card.expanded .expand-arrow{transform:rotate(90deg)}
.scene-card .card-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.scene-card .card-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1.5px;color:var(--ink);flex:1}
.scene-card .card-badges{display:flex;gap:4px;flex-shrink:0}
.scene-card .card-id{font-size:9px;color:var(--text-muted);font-family:monospace;flex-shrink:0}
.scene-card .choice-count{font-size:10px;color:var(--text-muted);flex-shrink:0}
.used-by{font-size:9px;color:var(--blue);margin-left:4px}

/* Story editor card */
.story-edit-card{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:20px;margin-bottom:16px}
.story-edit-card h3{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--ink);margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--ink)}

/* Fields */
.field-label{font-size:9px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px;display:block}
.field-input{width:100%;background:var(--surface-alt);border:1px solid var(--border-light);color:var(--text);padding:8px 10px;border-radius:3px;font-size:13px;outline:none;margin-bottom:12px}
.field-input:focus{border-color:var(--accent)}
.field-textarea{width:100%;background:var(--surface-alt);border:1px solid var(--border-light);color:var(--text);padding:10px;border-radius:3px;font-size:13px;outline:none;margin-bottom:12px;resize:none;min-height:60px;line-height:1.7;overflow:hidden}
.field-textarea:focus{border-color:var(--accent)}
.field-select{width:100%;background:var(--surface-alt);border:1px solid var(--border-light);color:var(--text);padding:6px 8px;border-radius:3px;font-size:12px;outline:none}

/* Choice cards */
.choice-card{background:var(--surface-alt);border:1px solid var(--border-light);border-radius:3px;padding:10px 12px;margin-bottom:8px}
.choice-card .choice-letter{font-size:10px;font-weight:800;color:var(--accent-dark);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.choice-card .choice-actions{display:flex;gap:3px}
.choice-card .choice-actions button{background:none;border:none;color:var(--text-muted);font-size:10px;padding:2px 4px;cursor:pointer;border-radius:2px}
.choice-card .choice-actions button:hover{background:var(--border-light)}
.choice-card .choice-actions .del:hover{background:var(--rust-light);color:var(--rust)}
.choice-target{display:flex;align-items:center;gap:6px;margin-top:6px}
.choice-target .arrow{color:var(--accent);font-size:11px}
.choice-target .target-name{font-size:11px;color:var(--text-sec);cursor:pointer}.choice-target .target-name:hover{color:var(--accent-dark);text-decoration:underline}

/* Scores */
.scores-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.score-chip{display:flex;align-items:center;gap:6px;background:var(--surface-alt);border:1px solid var(--border-light);border-radius:3px;padding:4px 8px}
.score-chip .chip-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.score-chip label{font-size:10px;color:var(--text-muted);font-weight:600}
.score-chip input{width:48px;background:transparent;border:none;color:var(--text);font-size:13px;font-weight:700;text-align:center;outline:none;font-family:'DM Sans',sans-serif}

/* Image */
.img-row{display:flex;gap:6px;margin-bottom:12px}
.img-preview{margin-bottom:12px;border-radius:3px;overflow:hidden;border:1px solid var(--border-light)}
.img-preview img{display:block;max-height:160px;width:100%;object-fit:cover}
.img-controls{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;background:var(--surface-alt)}
.size-btns{display:flex;gap:3px}
.size-btn{font-size:9px;padding:2px 6px;border:1px solid var(--border-light);border-radius:2px;background:var(--surface);color:var(--text-muted);cursor:pointer;font-weight:600}
.size-btn.active{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.remove-btn{font-size:9px;color:var(--rust);background:var(--rust-light);border:1px solid #e8c4c0;border-radius:2px;padding:2px 6px;cursor:pointer;font-weight:600}

/* Footer */
.scene-footer{display:flex;gap:6px;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--border-light);margin-top:8px}
.scene-footer button{font-size:10px;padding:4px 10px;border-radius:3px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);font-weight:600;letter-spacing:0.03em}
.scene-footer button:hover{border-color:var(--accent);color:var(--accent-dark)}
.scene-footer .del-btn{color:var(--rust);border-color:var(--rust-light)}.scene-footer .del-btn:hover{background:var(--rust);color:#fff;border-color:var(--rust)}

/* Preview */
.preview-container{max-width:640px;margin:0 auto}
.preview-card{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:24px;margin-bottom:16px}
.preview-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px}
.preview-narrative{font-size:14px;line-height:1.75;color:var(--text-sec);white-space:pre-line;margin-bottom:16px}
.preview-choices{display:flex;flex-direction:column;gap:8px}
.preview-choice{background:var(--surface-alt);border:1px solid var(--border);border-radius:3px;padding:10px 14px;cursor:pointer;font-size:13px;transition:all 0.15s;display:flex;align-items:center;gap:10px}
.preview-choice:hover{border-color:var(--accent);background:var(--accent-glow)}
.preview-letter{width:24px;height:24px;border-radius:50%;background:var(--border-light);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--text-muted);flex-shrink:0}
.preview-choice:hover .preview-letter{background:var(--accent);color:var(--ink)}
.preview-restart{font-size:11px;color:var(--accent-dark);cursor:pointer;font-weight:600;text-transform:uppercase;letter-spacing:0.05em}

/* Settings */
.settings-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:100}
.settings-panel{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:24px;width:460px;max-height:80vh;overflow-y:auto}
.settings-panel h2{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;color:var(--ink);margin-bottom:4px}
.settings-panel p{font-size:12px;color:var(--text-muted);margin-bottom:16px;line-height:1.6}
.token-status{padding:8px 12px;border-radius:3px;font-size:12px;margin-bottom:12px}
.token-ok{background:var(--sage-light);border:1px solid #bbf7d0;color:var(--sage)}
.token-missing{background:var(--rust-light);border:1px solid #e8c4c0;color:var(--rust)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);border:1px solid var(--accent);color:var(--accent);padding:7px 18px;border-radius:3px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 4px 20px rgba(0,0,0,0.15)}
.scene-list::-webkit-scrollbar,.main::-webkit-scrollbar{width:6px}
.scene-list::-webkit-scrollbar-track,.main::-webkit-scrollbar-track{background:transparent}
.scene-list::-webkit-scrollbar-thumb{background:#2a2826;border-radius:3px}
.main::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.hidden{display:none}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const { useState, useCallback, useRef, useEffect } = React;
const SCORE_KEYS=["strategy","stakeholders","significance","reach","evidence"];
const SCORE_COLORS={strategy:"#E8A838",stakeholders:"#4a6741",significance:"#c0392b",reach:"#5b7fb5",evidence:"#96CEB4"};
const SCORE_LABELS={strategy:"Strategy",stakeholders:"Stakeholders",significance:"Significance",reach:"Reach",evidence:"Evidence"};
const ENDING_TYPES=["none","policy","practitioner","cycle"];
const uid=()=>"node_"+Math.random().toString(36).slice(2,8);

const DEFAULT_DATA={
  stories:{impact_quest:{title:"The Impact Quest",description:"Navigate from publication to real-world impact.",image:"",startScene:"start"}},
  scenes:{start:{title:"Getting Started",narrative:"Welcome. Edit this scene or import your game data.",choices:[]}}
};

function Editor(){
  const [data,setData]=useState(DEFAULT_DATA);
  const dataRef=useRef(data);dataRef.current=data;
  const [sidebarTab,setSidebarTab]=useState("stories"); // stories | scenes
  const [selectedStory,setSelectedStory]=useState("");
  const [expanded,setExpanded]=useState("");
  const [search,setSearch]=useState("");
  const [view,setView]=useState("story"); // story | preview
  const [previewNode,setPreviewNode]=useState("start");
  const [toast,setToast]=useState(null);
  const [showSettings,setShowSettings]=useState(false);
  const [ghToken,setGhToken]=useState(()=>localStorage.getItem("iq_gh_token")||"");
  const [ghRepo,setGhRepo]=useState(()=>localStorage.getItem("iq_gh_repo")||"paulbrbeal/Impact-Quest");
  const [saving,setSaving]=useState(false);
  const [uploading,setUploading]=useState(false);
  const [dataVersion,setDataVersion]=useState(0);
  const fileRef=useRef(null);
  const imgRef=useRef(null);

  const flash=useCallback((msg)=>{setToast(msg);setTimeout(()=>setToast(null),2500);},[]);

  // Helpers to update stories and scenes
  const updateScene=(id,changes)=>{setData(prev=>({...prev,scenes:{...prev.scenes,[id]:{...prev.scenes[id],...changes}}}));};
  const updateStory=(sid,changes)=>{setData(prev=>({...prev,stories:{...prev.stories,[sid]:{...prev.stories[sid],...changes}}}));};

  // Auto-load
  useEffect(()=>{
    const token=(localStorage.getItem("iq_gh_token")||"").replace(/[^\x20-\x7E]/g,"").trim();
    const repo=localStorage.getItem("iq_gh_repo")||"paulbrbeal/Impact-Quest";
    const loadData=(d)=>{
      if(!d||typeof d!=="object") return;
      if(!d.stories){d={stories:{default:{title:"The Impact Quest",description:"",startScene:"start"}},scenes:d};}
      setData(d);setDataVersion(v=>v+1);
      var firstStory=Object.keys(d.stories)[0]||"";
      setSelectedStory(firstStory);
      if(d.stories[firstStory])setExpanded(d.stories[firstStory].startScene||"");
    };
    const loadFromPages=()=>{
      fetch("game-data.json?t="+Date.now()).then(r=>r.json()).then(loadData).catch(()=>{});
    };
    if(token){
      fetch("https://api.github.com/repos/"+repo+"/contents/game-data.json",{headers:{"Authorization":"Bearer "+token}})
        .then(function(r){if(!r.ok)throw new Error("API "+r.status);return r.json();})
        .then(function(resp){
          if(!resp||!resp.content)throw new Error("No content");
          var raw=atob(resp.content.replace(/\n/g,""));
          var d=JSON.parse(raw);
          loadData(d);
        })
        .catch(function(err){
          console.log("API load failed, falling back to Pages:",err.message);
          loadFromPages();
        });
    } else {
      loadFromPages();
    }
  },[]);

  const saveSettings=(t,r)=>{setGhToken(t);setGhRepo(r);if(t)localStorage.setItem("iq_gh_token",t);else localStorage.removeItem("iq_gh_token");if(r)localStorage.setItem("iq_gh_repo",r);else localStorage.removeItem("iq_gh_repo");};

  // Story CRUD
  const addStory=()=>{const sid="story_"+Math.random().toString(36).slice(2,6);setData(prev=>({...prev,stories:{...prev.stories,[sid]:{title:"New Story",description:"",image:"",startScene:""}}}));setSelectedStory(sid);setSidebarTab("stories");};
  const deleteStory=(sid)=>{if(Object.keys(data.stories).length<=1){flash("Need at least one story");return;}setData(prev=>{const s={...prev.stories};delete s[sid];return{...prev,stories:s};});if(selectedStory===sid)setSelectedStory(Object.keys(data.stories).filter(k=>k!==sid)[0]||"");flash("Story deleted");};

  // Scene CRUD
  const addScene=()=>{const id=uid();setData(prev=>({...prev,scenes:{...prev.scenes,[id]:{title:"New Scene",narrative:"",choices:[],scoreEffect:{}}}}));setExpanded(id);setSidebarTab("scenes");flash("Scene added");};
  const deleteScene=(id)=>{setData(prev=>{const s={...prev.scenes};delete s[id];Object.values(s).forEach(n=>{if(n.choices)n.choices=n.choices.map(c=>c.next===id?{...c,next:""}:c);});return{...prev,scenes:s};});if(expanded===id)setExpanded("");flash("Scene deleted");};
  const duplicateScene=(id)=>{const src=data.scenes[id];const nid=uid();setData(prev=>({...prev,scenes:{...prev.scenes,[nid]:{...src,title:src.title+" (copy)",choices:(src.choices||[]).map(c=>({...c})),scoreEffect:{...(src.scoreEffect||{})}}}}));setExpanded(nid);flash("Duplicated");};
  const renameScene=(oldId,newId)=>{
    newId=newId.trim().toLowerCase().replace(/[^a-z0-9_]/g,"_");
    if(!newId||newId===oldId)return;if(data.scenes[newId]){flash("ID exists");return;}
    setData(prev=>{
      const scenes={};Object.entries(prev.scenes).forEach(([id,n])=>{const key=id===oldId?newId:id;scenes[key]={...n,choices:(n.choices||[]).map(c=>c.next===oldId?{...c,next:newId}:{...c})};});
      const stories={};Object.entries(prev.stories).forEach(([sid,s])=>{stories[sid]={...s,startScene:s.startScene===oldId?newId:s.startScene};});
      return{...prev,scenes,stories};
    });
    if(expanded===oldId)setExpanded(newId);flash("Renamed");
  };

  // Choice ops
  const addChoice=(nid)=>{setData(prev=>({...prev,scenes:{...prev.scenes,[nid]:{...prev.scenes[nid],choices:[...(prev.scenes[nid].choices||[]),{text:"New choice",next:""}]}}}));};
  const updateChoice=(nid,idx,changes)=>{setData(prev=>{const n=prev.scenes[nid];const ch=[...n.choices];ch[idx]={...ch[idx],...changes};return{...prev,scenes:{...prev.scenes,[nid]:{...n,choices:ch}}};});};
  const removeChoice=(nid,idx)=>{setData(prev=>{const n=prev.scenes[nid];return{...prev,scenes:{...prev.scenes,[nid]:{...n,choices:n.choices.filter((_,i)=>i!==idx)}}};});};
  const moveChoice=(nid,idx,dir)=>{setData(prev=>{const n=prev.scenes[nid];const ch=[...n.choices];const j=idx+dir;if(j<0||j>=ch.length)return prev;[ch[idx],ch[j]]=[ch[j],ch[idx]];return{...prev,scenes:{...prev.scenes,[nid]:{...n,choices:ch}}};});};

  // Find which stories use a scene (by tracing from startScene)
  const getSceneStories=(sceneId)=>{
    const result=[];
    Object.entries(data.stories).forEach(([sid,story])=>{
      const visited=new Set();const queue=[story.startScene];
      while(queue.length>0){const id=queue.shift();if(!id||visited.has(id)||!data.scenes[id])continue;visited.add(id);(data.scenes[id].choices||[]).forEach(c=>{if(c.next)queue.push(c.next);});}
      if(visited.has(sceneId))result.push({id:sid,title:story.title});
    });
    return result;
  };

  // Save to GitHub
  const saveToGitHub=()=>{
    if(document.activeElement&&document.activeElement.tagName==="TEXTAREA")document.activeElement.blur();
    setTimeout(()=>{
      const cleanToken=(ghToken||"").replace(/[^\x20-\x7E]/g,"").trim();
      if(!cleanToken){flash("Set up token in Settings");setShowSettings(true);return;}
      setSaving(true);flash("Saving...");
      const d=dataRef.current;
      const b64=btoa(unescape(encodeURIComponent(JSON.stringify(d,null,2))));
      const apiUrl="https://api.github.com/repos/"+ghRepo+"/contents/game-data.json";
      fetch(apiUrl,{headers:{"Authorization":"Bearer "+cleanToken}}).then(r=>r.ok?r.json():null).then(existing=>{
        const body={message:"Update game data",content:b64};if(existing&&existing.sha)body.sha=existing.sha;
        return fetch(apiUrl,{method:"PUT",headers:{"Authorization":"Bearer "+cleanToken,"Content-Type":"application/json"},body:JSON.stringify(body)});
      }).then(r=>{if(!r.ok)throw new Error("API "+r.status);return r.json();}).then(()=>{setSaving(false);flash("Saved!");}).catch(err=>{setSaving(false);flash("Save failed: "+err.message);});
    },100);
  };

  const exportJSON=()=>{const blob=new Blob([JSON.stringify(dataRef.current,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="game-data.json";document.body.appendChild(a);a.click();document.body.removeChild(a);flash("Downloaded!");};
  const importFile=(e)=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=(ev)=>{try{const d=JSON.parse(ev.target.result);if(!d.stories)d={stories:{default:{title:"Imported",description:"",startScene:Object.keys(d)[0]||"start"}},scenes:d};setData(d);setDataVersion(v=>v+1);setSelectedStory(Object.keys(d.stories)[0]||"");flash(Object.keys(d.scenes||{}).length+" scenes imported");}catch(err){flash("Invalid JSON");}};reader.readAsText(file);e.target.value="";};

  const uploadImage=(targetType,targetId,file)=>{
    const cleanToken=(ghToken||"").replace(/[^\x20-\x7E]/g,"").trim();
    if(!cleanToken){flash("Set up token in Settings");setShowSettings(true);return;}
    if(file.size>5*1024*1024){flash("Max 5MB");return;}
    setUploading(true);
    const reader=new FileReader();reader.onload=(ev)=>{
      const base64=ev.target.result.split(",")[1];const safeName=file.name.toLowerCase().replace(/[^a-z0-9.\-_]/g,"-");
      const path="images/"+safeName;const url="https://api.github.com/repos/"+ghRepo+"/contents/"+path;
      fetch(url,{headers:{"Authorization":"Bearer "+cleanToken}}).then(r=>r.ok?r.json():null).then(existing=>{
        const body={message:"Upload: "+safeName,content:base64};if(existing&&existing.sha)body.sha=existing.sha;
        return fetch(url,{method:"PUT",headers:{"Authorization":"Bearer "+cleanToken,"Content-Type":"application/json"},body:JSON.stringify(body)});
      }).then(r=>{if(!r.ok)throw new Error(""+r.status);return r.json();}).then(()=>{
        const parts=ghRepo.split("/");const pagesUrl="https://"+parts[0]+".github.io/"+parts[1]+"/"+path;
        if(targetType==="scene")updateScene(targetId,{image:pagesUrl});
        else if(targetType==="story")updateStory(targetId,{image:pagesUrl});
        setUploading(false);flash("Uploaded!");
      }).catch(err=>{setUploading(false);flash("Upload failed: "+err.message);});
    };reader.readAsDataURL(file);
  };

  // Computed
  const stories=data.stories||{};
  const scenes=data.scenes||{};
  const sceneList=Object.entries(scenes);
  const storyList=Object.entries(stories);
  const totalScenes=sceneList.length;
  const totalEndings=sceneList.filter(([_,n])=>n.isEnding).length;
  const totalStories=storyList.length;

  // Get all scenes reachable from a story's start scene
  const getStoryScenes=(sid)=>{
    const story=stories[sid];
    if(!story||!story.startScene)return new Set();
    const visited=new Set();const queue=[story.startScene];
    while(queue.length>0){const id=queue.shift();if(!id||visited.has(id)||!scenes[id])continue;visited.add(id);(scenes[id].choices||[]).forEach(c=>{if(c.next)queue.push(c.next);});}
    return visited;
  };

  // Filter scenes: if on Stories tab with a story selected, show only that story's scenes
  // If on All Scenes tab or searching, show all (filtered by search)
  const storySceneIds=selectedStory&&sidebarTab==="stories"?getStoryScenes(selectedStory):null;
  const filteredScenes=(()=>{
    let list=sceneList;
    if(storySceneIds)list=list.filter(([id])=>storySceneIds.has(id));
    if(search)list=list.filter(([id,n])=>n.title.toLowerCase().includes(search.toLowerCase())||id.includes(search.toLowerCase()));
    return list;
  })();

  const getDotColor=(id,n)=>{if(Object.values(stories).some(s=>s.startScene===id))return"var(--accent)";if(n.isEnding)return"var(--sage)";if((n.choices||[]).some(c=>c.next&&!scenes[c.next]))return"var(--rust)";return"var(--border)";};

  // Preview
  const PreviewMode=()=>{
    const story=selectedStory?stories[selectedStory]:null;
    const pn=scenes[previewNode];
    if(!pn)return <div className="preview-container"><p>Scene not found. Select a story first.</p></div>;
    return(<div className="preview-container">
      <div style={{fontSize:11,color:"var(--text-muted)",marginBottom:12,textTransform:"uppercase",letterSpacing:1}}>
        Preview{story?" — "+story.title:""} — <span className="preview-restart" onClick={()=>setPreviewNode(story?story.startScene:"start")}>Restart</span>
      </div>
      <div className="preview-card">
        <div className="preview-title">{pn.title}</div>
        {pn.image&&<img src={pn.image} alt="" style={{width:"100%",maxHeight:200,objectFit:"cover",borderRadius:3,marginBottom:12}} />}
        <div className="preview-narrative">{pn.narrative}</div>
        {pn.isEnding?(<div style={{textAlign:"center",padding:16}}><div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:24,color:"var(--accent-dark)",letterSpacing:2}}>THE END</div><span className="preview-restart" onClick={()=>setPreviewNode(story?story.startScene:"start")} style={{marginTop:12,display:"inline-block"}}>Play Again</span></div>
        ):(<div className="preview-choices">{(pn.choices||[]).map((c,i)=>(<div key={i} className="preview-choice" onClick={()=>{if(c.next&&scenes[c.next])setPreviewNode(c.next);}}><span className="preview-letter">{String.fromCharCode(65+i)}</span>{c.text}</div>))}</div>)}
      </div>
    </div>);
  };

  return(
    <div className="app">
      <div className="sidebar">
        <div className="sidebar-header"><div className="logo"><em>IMPACT</em> QUEST</div></div>
        <div className="sidebar-stats">
          <div className="stat"><div className="stat-num">{totalStories}</div><div className="stat-lbl">Stories</div></div>
          <div className="stat"><div className="stat-num">{totalScenes}</div><div className="stat-lbl">Scenes</div></div>
          <div className="stat"><div className="stat-num">{totalEndings}</div><div className="stat-lbl">Endings</div></div>
        </div>
        <div className="sidebar-actions">
          <button className="sb-btn primary" disabled={saving} onClick={saveToGitHub}>{saving?"Saving...":"Save"}</button>
          <button className="sb-btn" onClick={addStory}>+ Story</button>
          <button className="sb-btn" onClick={addScene}>+ Scene</button>
          <button className="sb-btn" onClick={exportJSON}>Export</button>
          <button className="sb-btn" onClick={()=>fileRef.current.click()}>Import</button>
          <button className="sb-btn" onClick={()=>setShowSettings(true)}>⚙</button>
          <input ref={fileRef} type="file" accept=".json" onChange={importFile} className="hidden" />
          <input ref={imgRef} type="file" accept="image/*" onChange={e=>{if(e.target.files[0]){const t=imgRef.current.dataset.targetType;const tid=imgRef.current.dataset.targetId;uploadImage(t,tid,e.target.files[0]);}e.target.value="";}} className="hidden" />
        </div>
        <div className="sidebar-nav">
          <button className={"nav-tab"+(sidebarTab==="stories"?" active":"")} onClick={()=>setSidebarTab("stories")}>Stories</button>
          <button className={"nav-tab"+(sidebarTab==="scenes"?" active":"")} onClick={()=>setSidebarTab("scenes")}>All Scenes</button>
          <button className={"nav-tab"+(sidebarTab==="ieo"?" active":"")} onClick={()=>setSidebarTab("ieo")}>IEO Advice</button>
        </div>
        {sidebarTab==="scenes"&&<div className="sidebar-search"><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search scenes..." /></div>}
        <div className="scene-list">
          {sidebarTab==="stories"&&storyList.map(([sid,s])=>(
            <div key={sid} className={"story-item"+(selectedStory===sid?" active":"")} onClick={()=>{setSelectedStory(sid);setView("story");if(s.startScene)setExpanded(s.startScene);}}>
              <div className="s-title">{s.title}</div>
              <div className="s-meta">{sid} · starts at {s.startScene||"none"}</div>
            </div>
          ))}
          {sidebarTab==="scenes"&&filteredScenes.map(([id,n])=>{
            const usedBy=getSceneStories(id);
            return(<div key={id} className={"scene-item"+(expanded===id?" active":"")} onClick={()=>{setExpanded(id);setView("story");}}>
              <div className="dot" style={{background:getDotColor(id,n)}} />
              <div className="info">
                <div className="title">{n.title}</div>
                <div className="meta">{id} · {(n.choices||[]).length}ch{usedBy.length>0?" · "+usedBy.length+" stor"+(usedBy.length===1?"y":"ies"):""}{n.phase?" · "+n.phase:""}</div>
                {(n.categories||[]).length>0&&<div style={{display:"flex",gap:2,marginTop:2,flexWrap:"wrap"}}>{(n.categories||[]).map(c=><span key={c} style={{fontSize:7,fontWeight:700,textTransform:"uppercase",letterSpacing:0.3,padding:"1px 4px",borderRadius:1,background:c==="strategy"?"#fef3c7":c==="stakeholders"?"#d1fae5":c==="significance"?"#fee2e2":c==="reach"?"#dbeafe":"#d8efe0",color:c==="strategy"?"#92400e":c==="stakeholders"?"#065f46":c==="significance"?"#991b1b":c==="reach"?"#1e40af":"#1f5c3d"}}>{c.slice(0,4)}</span>)}</div>}
              </div>
            </div>);
          })}
        </div>
      </div>

      <div className="main">
        <div className="main-header">
          <div className="main-title"><em>STORY</em> EDITOR</div>
          <div className="view-tabs">
            <button className={"view-tab"+(view==="story"?" active":"")} onClick={()=>setView("story")}>Edit</button>
            <button className={"view-tab"+(view==="preview"?" active":"")} onClick={()=>{setView("preview");const s=selectedStory&&stories[selectedStory];setPreviewNode(s?s.startScene:"start");}}>Preview</button>
          </div>
        </div>

        {view==="story"&&sidebarTab!=="ieo"&&(<>
          {/* Story editor */}
          {selectedStory&&stories[selectedStory]&&(()=>{
            const sid=selectedStory;const s=stories[sid];
            return(<div className="story-edit-card">
              <h3>{s.title||"Untitled Story"}</h3>
              <label className="field-label">Story Title</label>
              <input className="field-input" value={s.title} onChange={e=>updateStory(sid,{title:e.target.value})} />
              <label className="field-label">Description</label>
              <input className="field-input" value={s.description||""} onChange={e=>updateStory(sid,{description:e.target.value})} placeholder="Short description for the selection screen" />
              <label className="field-label">Cover Image</label>
              <div className="img-row">
                <input className="field-input" style={{marginBottom:0}} value={s.image||""} onChange={e=>updateStory(sid,{image:e.target.value})} placeholder="URL or upload" />
                <button className="sb-btn primary" style={{fontSize:9,padding:"4px 8px"}} disabled={uploading} onClick={()=>{imgRef.current.dataset.targetType="story";imgRef.current.dataset.targetId=sid;imgRef.current.click();}}>{uploading?"...":"Upload"}</button>
              </div>
              {s.image&&<div className="img-preview" style={{marginTop:8}}><img src={s.image} alt="" /></div>}
              <div style={{marginTop:12}}><label className="field-label">Start Scene</label>
              <select className="field-select" value={s.startScene||""} onChange={e=>updateStory(sid,{startScene:e.target.value})}>
                <option value="">— Select —</option>
                {sceneList.map(([id,n])=><option key={id} value={id}>{n.title} ({id})</option>)}
              </select></div>
              <div style={{marginTop:12,display:"flex",gap:6}}>
                <button className="sb-btn" style={{fontSize:9}} onClick={()=>{const v=prompt("New story ID:",sid);if(v){const nid=v.trim().toLowerCase().replace(/[^a-z0-9_]/g,"_");if(nid&&nid!==sid&&!stories[nid]){setData(prev=>{const st={};Object.entries(prev.stories).forEach(([k,v])=>{st[k===sid?nid:k]=v;});return{...prev,stories:st};});setSelectedStory(nid);flash("Renamed");}}}}>Rename ID</button>
                {storyList.length>1&&<button className="sb-btn" style={{fontSize:9,color:"var(--rust)"}} onClick={()=>{if(confirm("Delete story '"+s.title+"'? Scenes will not be deleted."))deleteStory(sid);}}>Delete Story</button>}
              </div>
            </div>);
          })()}

          {/* Scene cards */}
          {selectedStory&&stories[selectedStory]&&storySceneIds&&(
            <div style={{fontSize:11,color:"var(--text-muted)",marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span>Showing {filteredScenes.length} scene{filteredScenes.length!==1?"s":""} in <strong style={{color:"var(--text)"}}>{stories[selectedStory].title}</strong></span>
              <button className="sb-btn" style={{fontSize:9}} onClick={()=>setSidebarTab("scenes")}>View all {totalScenes} scenes</button>
            </div>
          )}
          {filteredScenes.map(([id,n])=>{
            const isExp=expanded===id;
            const usedBy=getSceneStories(id);
            return(
            <div key={id} className={"scene-card"+(isExp?" expanded":"")}>
              <div className="scene-card-header" onClick={()=>setExpanded(isExp?"":id)}>
                <span className="expand-arrow">▶</span>
                <div className="card-dot" style={{background:getDotColor(id,n)}} />
                <span className="card-title">{n.title||"Untitled"}</span>
                <span className="card-id">{id}</span>
                <div className="card-badges">
                  {Object.values(stories).some(s=>s.startScene===id)&&<span className="badge" style={{background:"var(--accent)",color:"var(--ink)"}}>START</span>}
                  {n.isEnding&&<span className="badge" style={{background:"var(--sage)",color:"#fff"}}>END</span>}
                  {n.image&&<span className="badge" style={{background:"var(--blue)",color:"#fff"}}>IMG</span>}
                  {(n.choices||[]).some(c=>c.next&&!scenes[c.next])&&<span className="badge" style={{background:"var(--rust)",color:"#fff"}}>FIX</span>}
                </div>
                {usedBy.length>0&&<span className="used-by">{usedBy.length} stor{usedBy.length===1?"y":"ies"}</span>}
                <span className="choice-count">{(n.choices||[]).length} ch</span>
              </div>
              {isExp&&(<div style={{padding:"0 18px 18px"}}>
                <label className="field-label">Title</label>
                <input className="field-input" value={n.title} onChange={e=>updateScene(id,{title:e.target.value})} />

                <label className="field-label">Image</label>
                <div className="img-row">
                  <input className="field-input" style={{marginBottom:0}} value={n.image||""} onChange={e=>updateScene(id,{image:e.target.value})} placeholder="URL or upload" />
                  {n.image&&<button className="remove-btn" onClick={()=>updateScene(id,{image:"",imageSize:undefined})}>Remove</button>}
                  <button className="sb-btn primary" style={{fontSize:9,padding:"4px 8px"}} disabled={uploading} onClick={()=>{imgRef.current.dataset.targetType="scene";imgRef.current.dataset.targetId=id;imgRef.current.click();}}>{uploading?"...":"Upload"}</button>
                </div>
                {n.image&&(<div className="img-preview" style={{marginTop:8}}>
                  <img src={n.image} alt="" style={{width:n.imageSize==="small"?"40%":n.imageSize==="medium"?"65%":"100%"}} onError={e=>{e.target.alt="Not found";e.target.style.background="var(--surface-alt)";e.target.style.minHeight="40px";}} />
                  <div className="img-controls"><div className="size-btns">{["small","medium","large","banner"].map(s=>(<button key={s} className={"size-btn"+((n.imageSize||"large")===s?" active":"")} onClick={()=>updateScene(id,{imageSize:s})}>{s}</button>))}</div></div>
                </div>)}

                <label className="field-label">Narrative</label>
                <textarea className="field-textarea" defaultValue={n.narrative} key={id+"_narr_"+dataVersion} onBlur={e=>updateScene(id,{narrative:e.target.value})} onChange={e=>{e.target.style.height="auto";e.target.style.height=e.target.scrollHeight+"px";dataRef.current={...dataRef.current,scenes:{...dataRef.current.scenes,[id]:{...dataRef.current.scenes[id],narrative:e.target.value}}};}} style={{minHeight:Math.max(60,((n.narrative||"").split("\n").length+1)*22+20)+"px"}} />

                <label className="field-label">Score Effects</label>
                <div className="scores-row">{SCORE_KEYS.map(k=>(<div className="score-chip" key={k}><div className="chip-dot" style={{background:SCORE_COLORS[k]}} /><label>{SCORE_LABELS[k]}</label><input type="number" value={(n.scoreEffect&&n.scoreEffect[k])||0} onChange={e=>{const v=parseInt(e.target.value)||0;const se={...(n.scoreEffect||{})};if(v===0)delete se[k];else se[k]=v;updateScene(id,{scoreEffect:se});}} /></div>))}</div>

                <label className="field-label">Categories</label>
                <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:12}}>
                  {["strategy","stakeholders","significance","reach","evidence"].map(c=>{
                    const active=(n.categories||[]).includes(c);
                    return <button key={c} style={{fontSize:9,fontWeight:600,textTransform:"uppercase",letterSpacing:0.5,padding:"3px 8px",borderRadius:2,cursor:"pointer",border:active?"1px solid var(--accent)":"1px solid var(--border)",background:active?"var(--accent-glow)":"transparent",color:active?"var(--accent-dark)":"var(--text-muted)",fontFamily:"inherit"}} onClick={()=>{const cats=new Set(n.categories||[]);if(active)cats.delete(c);else cats.add(c);updateScene(id,{categories:[...cats]});}}>{c}</button>;
                  })}
                </div>

                <label className="field-label">Impact Types</label>
                <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:12}}>
                  {["policy","practice","health","educational","societal","economic","technological"].map(t=>{
                    const active=(n.impactTypes||[]).includes(t);
                    return <button key={t} style={{fontSize:9,fontWeight:600,textTransform:"uppercase",letterSpacing:0.5,padding:"3px 8px",borderRadius:2,cursor:"pointer",border:active?"1px solid var(--sage)":"1px solid var(--border)",background:active?"#d1fae533":"transparent",color:active?"var(--sage)":"var(--text-muted)",fontFamily:"inherit"}} onClick={()=>{const types=new Set(n.impactTypes||[]);if(active)types.delete(t);else types.add(t);updateScene(id,{impactTypes:[...types]});}}>{t}</button>;
                  })}
                </div>

                <label className="field-label">Phase</label>
                <select className="field-select" style={{width:"auto",marginBottom:12}} value={n.phase||""} onChange={e=>updateScene(id,{phase:e.target.value||undefined})}>
                  <option value="">None</option>
                  <option value="planning">Planning</option>
                  <option value="evidence">Evidence</option>
                  <option value="engagement">Engagement</option>
                  <option value="translation">Translation</option>
                  <option value="adoption">Adoption</option>
                  <option value="scaling">Scaling</option>
                </select>

                <div style={{display:"flex",gap:12,alignItems:"center",marginBottom:12}}>
                  <label className="field-label" style={{marginBottom:0}}>Ending</label>
                  <select className="field-select" style={{width:"auto"}} value={n.isEnding?(n.endingType||"policy"):"none"} onChange={e=>{if(e.target.value==="none")updateScene(id,{isEnding:false,endingType:undefined});else updateScene(id,{isEnding:true,endingType:e.target.value});}}>
                    {ENDING_TYPES.map(t=><option key={t} value={t}>{t==="none"?"Not an ending":t.charAt(0).toUpperCase()+t.slice(1)}</option>)}
                  </select>
                  {usedBy.length>0&&<span style={{fontSize:10,color:"var(--blue)"}}>Used in: {usedBy.map(u=>u.title).join(", ")}</span>}
                </div>

                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                  <label className="field-label" style={{marginBottom:0}}>Choices ({(n.choices||[]).length})</label>
                  <button className="sb-btn" onClick={()=>addChoice(id)}>+ Choice</button>
                </div>
                {(n.choices||[]).map((c,i)=>(<div className="choice-card" key={i}>
                  <div className="choice-letter"><span>Choice {String.fromCharCode(65+i)}</span><div className="choice-actions"><button onClick={()=>moveChoice(id,i,-1)} disabled={i===0}>↑</button><button onClick={()=>moveChoice(id,i,1)} disabled={i>=(n.choices||[]).length-1}>↓</button><button className="del" onClick={()=>removeChoice(id,i)}>✕</button></div></div>
                  <input className="field-input" style={{marginBottom:4}} value={c.text} onChange={e=>updateChoice(id,i,{text:e.target.value})} placeholder="Choice text..." />
                  <select className="field-select" value={c.next||""} onChange={e=>{if(e.target.value==="__new__"){const nid=uid();setData(prev=>({...prev,scenes:{...prev.scenes,[nid]:{title:"New Scene",narrative:"",choices:[],scoreEffect:{}}}}));updateChoice(id,i,{next:nid});setTimeout(()=>setExpanded(nid),50);}else{updateChoice(id,i,{next:e.target.value});}}}>
                    <option value="">— Link to scene —</option>
                    {sceneList.filter(([nid])=>nid!==id).map(([nid,nn])=>(<option key={nid} value={nid}>{nn.title} ({nid})</option>))}
                    <option value="__new__">+ Create new scene</option>
                  </select>
                  {c.next&&scenes[c.next]&&(<div className="choice-target"><span className="arrow">→</span><span className="target-name" onClick={()=>setExpanded(c.next)}>{scenes[c.next].title}</span></div>)}
                </div>))}

                <div className="scene-footer">
                  <div style={{display:"flex",gap:6}}>
                    <button onClick={()=>duplicateScene(id)}>Duplicate</button>
                    <button onClick={()=>{const v=prompt("New ID:",id);if(v)renameScene(id,v);}}>Rename ID</button>
                  </div>
                  <button className="del-btn" onClick={()=>{if(confirm("Delete '"+n.title+"'?"))deleteScene(id);}}>Delete</button>
                </div>
              </div>)}
            </div>);
          })}
        </>)}

        {view==="story"&&sidebarTab==="ieo"&&(()=>{
          const ieo=dataRef.current.ieoAdvice||{};
          const updateIEO=(path,value)=>{
            setData(prev=>{
              const newIeo={...(prev.ieoAdvice||{})};
              const parts=path.split(".");
              if(parts.length===1)newIeo[parts[0]]=value;
              else{newIeo[parts[0]]={...(newIeo[parts[0]]||{})};newIeo[parts[0]][parts[1]]=value;}
              return{...prev,ieoAdvice:newIeo};
            });
          };
          const mkArea=(label,path,val)=>(<div key={path} style={{marginBottom:16}}>
            <label className="field-label">{label}</label>
            <textarea className="field-textarea" style={{minHeight:80}} defaultValue={val||""} onBlur={e=>updateIEO(path,e.target.value)} />
          </div>);
          return(<div style={{padding:"0 24px 24px"}}>
            <h3 style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:22,letterSpacing:2,color:"var(--ink)",marginBottom:4}}>IEO ADVICE CONTENT</h3>
            <p style={{fontSize:11,color:"var(--text-muted)",marginBottom:20,lineHeight:1.6}}>Edit the text your Impact & Engagement Officer shows during gameplay. The game dynamically selects which advice to show based on the player's progress, scores, and current scene.</p>

            <h4 style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:16,letterSpacing:1.5,color:"var(--ink)",marginBottom:8,borderBottom:"1px solid var(--border)",paddingBottom:4}}>GREETINGS</h4>
            <p style={{fontSize:10,color:"var(--text-muted)",marginBottom:12}}>Shown based on how far the player is into the story.</p>
            {mkArea("Opening scene (0 decisions)","greetings.start",(ieo.greetings||{}).start)}
            {mkArea("Early game (1-2 decisions)","greetings.early",(ieo.greetings||{}).early)}
            {mkArea("Mid game (3-5 decisions)","greetings.mid",(ieo.greetings||{}).mid)}
            {mkArea("Late game (6+ decisions)","greetings.late",(ieo.greetings||{}).late)}

            <h4 style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:16,letterSpacing:1.5,color:"var(--ink)",marginBottom:8,marginTop:24,borderBottom:"1px solid var(--border)",paddingBottom:4}}>PHASE ADVICE</h4>
            <p style={{fontSize:10,color:"var(--text-muted)",marginBottom:12}}>Shown based on the current scene's phase tag.</p>
            {["planning","evidence","engagement","translation","adoption","scaling"].map(p=>mkArea(p.charAt(0).toUpperCase()+p.slice(1),"phaseAdvice."+p,(ieo.phaseAdvice||{})[p]))}

            <h4 style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:16,letterSpacing:1.5,color:"var(--ink)",marginBottom:8,marginTop:24,borderBottom:"1px solid var(--border)",paddingBottom:4}}>CATEGORY TIPS</h4>
            <p style={{fontSize:10,color:"var(--text-muted)",marginBottom:12}}>Shown based on the scene's REF dimension tags. The tip for the player's weakest dimension is prioritised.</p>
            {["strategy","stakeholders","significance","reach","evidence"].map(c=>mkArea(c.charAt(0).toUpperCase()+c.slice(1),"categoryTips."+c,(ieo.categoryTips||{})[c]))}

            <h4 style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:16,letterSpacing:1.5,color:"var(--ink)",marginBottom:8,marginTop:24,borderBottom:"1px solid var(--border)",paddingBottom:4}}>SCORE NUDGES</h4>
            <p style={{fontSize:10,color:"var(--text-muted)",marginBottom:12}}>Shown when score imbalances are detected. Use {"{weak}"} and {"{strong}"} as placeholders for dimension names.</p>
            {mkArea("Zero gap (one dimension at 0, another strong)","scoreNudges.zeroGap",(ieo.scoreNudges||{}).zeroGap)}
            {mkArea("Low gap (one dimension much weaker than strongest)","scoreNudges.lowGap",(ieo.scoreNudges||{}).lowGap)}
            {mkArea("Balanced (scores are even)","scoreNudges.balanced",(ieo.scoreNudges||{}).balanced)}

            <h4 style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:16,letterSpacing:1.5,color:"var(--ink)",marginBottom:8,marginTop:24,borderBottom:"1px solid var(--border)",paddingBottom:4}}>CLOSING LINES</h4>
            <p style={{fontSize:10,color:"var(--text-muted)",marginBottom:12}}>One is randomly picked each time. Add/edit lines below (one per box).</p>
            {(ieo.closingLines||[]).map((line,i)=>(<div key={i} style={{display:"flex",gap:8,marginBottom:8,alignItems:"start"}}>
              <textarea className="field-textarea" style={{minHeight:50,flex:1}} defaultValue={line} onBlur={e=>{
                setData(prev=>{const cl=[...(prev.ieoAdvice||{}).closingLines||[]];cl[i]=e.target.value;return{...prev,ieoAdvice:{...(prev.ieoAdvice||{}),closingLines:cl}};});
              }} />
              <button className="sb-btn" style={{color:"var(--rust)",fontSize:9,flexShrink:0}} onClick={()=>{
                setData(prev=>{const cl=[...(prev.ieoAdvice||{}).closingLines||[]];cl.splice(i,1);return{...prev,ieoAdvice:{...(prev.ieoAdvice||{}),closingLines:cl}};});
              }}>×</button>
            </div>))}
            <button className="sb-btn" onClick={()=>{
              setData(prev=>{const cl=[...(prev.ieoAdvice||{}).closingLines||[],""];return{...prev,ieoAdvice:{...(prev.ieoAdvice||{}),closingLines:cl}};});
            }}>+ Add closing line</button>
          </div>);
        })()}

        {view==="preview"&&<PreviewMode />}
      </div>

      {showSettings&&(<div className="settings-overlay" onClick={()=>setShowSettings(false)}><div className="settings-panel" onClick={e=>e.stopPropagation()}>
        <h2>SETTINGS</h2><p>Connect to GitHub to save and upload images.</p>
        <label className="field-label">Repository</label><input className="field-input" value={ghRepo} onChange={e=>setGhRepo(e.target.value)} placeholder="owner/repo" />
        <label className="field-label">Personal Access Token</label><input className="field-input" type="password" value={ghToken} onChange={e=>setGhToken(e.target.value)} placeholder="ghp_..." />
        <div style={{fontSize:10,color:"var(--text-muted)",marginBottom:12,lineHeight:1.6}}>GitHub → Settings → Developer settings → Tokens (classic) → <strong>repo</strong> scope. Set to No expiration.</div>
        <div className={"token-status "+(ghToken?"token-ok":"token-missing")}>{ghToken?"✓ Token set":"No token — save disabled"}</div>
        <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:12}}>
          {ghToken&&<button className="sb-btn" style={{color:"var(--rust)"}} onClick={()=>{saveSettings("",ghRepo);flash("Cleared");}}>Clear</button>}
          <button className="sb-btn primary" onClick={()=>{saveSettings(ghToken,ghRepo);setShowSettings(false);flash("Saved");}}>Save</button>
        </div>
      </div></div>)}

      {toast&&<div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.render(React.createElement(Editor),document.getElementById("root"));
</script>
</body>
</html>
