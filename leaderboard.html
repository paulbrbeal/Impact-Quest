<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard — The Impact Quest</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f0e8;--surface:#ffffff;--border:#d8d2c4;--text:#0f0e0d;--text-sec:#4a4540;--text-muted:#8c8272;--bar-bg:#ede8da;--accent:#e8963a;--accent-dark:#c4782a;--accent-glow:rgba(232,150,58,0.12);--ink:#0f0e0d;--sage:#4a6741;--rust:#c0392b}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding:20px}
.container{max-width:800px;margin:0 auto}
.header{text-align:center;margin-bottom:24px;padding-top:20px}
.header-label{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--accent-dark);margin-bottom:8px;font-weight:600}
.header h1{font-family:'Bebas Neue',sans-serif;font-size:48px;font-weight:400;color:var(--ink);letter-spacing:4px}
.header h1 em{font-style:normal;color:var(--accent)}
.back-link{display:inline-block;margin-bottom:20px;font-size:12px;color:var(--accent-dark);text-decoration:none;font-weight:600;letter-spacing:0.05em;text-transform:uppercase}
.back-link:hover{color:var(--accent)}
.hero-banner{margin-bottom:24px;border-radius:3px;overflow:hidden}
.hero-banner img{width:100%;max-height:200px;object-fit:cover;display:block}
.hero-tagline{padding:10px 16px;background:var(--surface);border:1px solid var(--border);border-top:none;font-size:13px;color:var(--text-sec);font-style:italic;text-align:center}

/* Story filter tabs */
.story-tabs{display:flex;gap:0;border:1px solid var(--border);border-radius:3px;overflow:hidden;margin-bottom:24px;flex-wrap:wrap}
.story-tab{padding:8px 16px;font-size:11px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;background:var(--surface);color:var(--text-muted);border:none;cursor:pointer;transition:all 0.15s;border-right:1px solid var(--border)}
.story-tab:last-child{border-right:none}
.story-tab.active{background:var(--ink);color:var(--bg)}
.story-tab:hover:not(.active){background:var(--bar-bg)}
.story-tab .tab-count{font-size:9px;opacity:0.6;margin-left:4px}

.stats-row{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:16px 20px;flex:1;min-width:120px;text-align:center}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--accent-dark);letter-spacing:2px;line-height:1}
.stat-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-top:4px}
.podium{display:flex;gap:16px;justify-content:center;align-items:flex-end;margin-bottom:24px;padding:0 20px}
.podium-item{text-align:center;flex:1;max-width:200px}
.podium-bar{background:var(--surface);border:1px solid var(--border);border-radius:3px 3px 0 0;padding:16px 12px}
.podium-rank{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px;line-height:1}
.podium-name{font-size:14px;font-weight:700;color:var(--text);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium-dept{font-size:11px;color:var(--text-muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium-score{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--accent-dark);letter-spacing:1px;margin-top:4px}
.podium-story{font-size:9px;color:var(--text-muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium-base{border-radius:0 0 3px 3px;padding:4px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#fff}
.gold .podium-rank{color:#d4a017}.gold .podium-base{background:#d4a017}.gold .podium-bar{min-height:140px}
.silver .podium-rank{color:#8a8a8a}.silver .podium-base{background:#8a8a8a}.silver .podium-bar{min-height:110px}
.bronze .podium-rank{color:#b87333}.bronze .podium-base{background:#b87333}.bronze .podium-bar{min-height:90px}
.lb-card{background:var(--surface);border:1px solid var(--border);border-radius:3px;overflow:hidden;margin-bottom:24px}
.lb-header{display:flex;padding:10px 16px;background:var(--ink);color:var(--bg);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px}
.lb-row{display:flex;padding:10px 16px;border-bottom:1px solid var(--bar-bg);font-size:13px;align-items:center;transition:background 0.1s}
.lb-row:last-child{border-bottom:none}.lb-row:hover{background:var(--bar-bg)}.lb-row.highlight{background:var(--accent-glow)}
.col-rank{width:40px;font-weight:700;color:var(--text-muted)}
.col-name{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-dept{width:130px;color:var(--text-muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-story{width:130px;font-size:11px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-ending{width:120px;font-size:11px;color:var(--text-muted);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-score{width:60px;text-align:right;font-weight:700;color:var(--accent-dark);font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px}
.empty{text-align:center;padding:60px 20px;color:var(--text-muted)}
.empty h2{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--ink);letter-spacing:2px;margin-bottom:8px}
.empty p{font-size:13px;line-height:1.6;margin-bottom:20px}
.empty-img{margin-bottom:20px;border-radius:3px;overflow:hidden}
.empty-img img{width:100%;max-height:240px;object-fit:cover}
.play-btn{display:inline-block;background:var(--accent);color:var(--ink);padding:12px 32px;border-radius:3px;text-decoration:none;font-size:13px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase}.play-btn:hover{background:var(--accent-dark)}
.action-row{display:flex;gap:10px;justify-content:center;margin-bottom:24px;flex-wrap:wrap}
.action-btn{border:none;border-radius:3px;padding:8px 18px;cursor:pointer;font-size:11px;font-weight:700;font-family:'DM Sans',sans-serif;letter-spacing:0.05em;text-transform:uppercase;transition:all 0.2s;text-decoration:none}
.action-btn.outline{background:none;border:1px solid var(--border);color:var(--text-muted)}.action-btn.outline:hover{border-color:var(--accent);color:var(--accent-dark)}
.action-btn.danger{background:none;border:1px solid var(--rust);color:var(--rust)}.action-btn.danger:hover{background:var(--rust);color:#fff}
.loading-msg{text-align:center;padding:40px;color:var(--text-muted);font-size:13px}
</style>
</head>
<body>
<div class="container">
  <a href="index.html" class="back-link">&larr; Back to Game</a>
  <div class="header">
    <div class="header-label">The Impact Quest</div>
    <h1><em>LEADER</em>BOARD</h1>
  </div>
  <div id="lb"><div class="loading-msg">Loading leaderboard...</div></div>
</div>
<script>
var LB_HERO_IMAGE="";
var LB_TAGLINE="Navigate the messy reality of turning research into real-world impact.";
var currentFilter="all";

function loadEntries(callback){
  fetch("leaderboard.json?t="+Date.now()).then(function(r){return r.ok?r.json():[];}).catch(function(){return [];}).then(function(remote){
    if(!Array.isArray(remote))remote=[];
    var local=[];try{local=JSON.parse(localStorage.getItem("iq_leaderboard")||"[]");}catch(e){}
    if(!Array.isArray(local))local=[];
    var seen={},entries=[];
    remote.concat(local).forEach(function(entry){
      if(!entry||!entry.name)return;
      var key=entry.name+"|"+(entry.date||"")+"|"+(entry.score||0);
      if(!seen[key]){seen[key]=true;entries.push(entry);}
    });
    callback(entries);
  });
}

function render(){loadEntries(function(entries){renderBoard(entries);});}

function renderBoard(allEntries){
  var el=document.getElementById("lb");

  // Get unique stories
  var storyMap={};
  allEntries.forEach(function(e){
    var sid=e.storyId||e.storyTitle||"Unknown";
    var sTitle=e.storyTitle||e.storyId||"Unknown";
    if(!storyMap[sid])storyMap[sid]={id:sid,title:sTitle,count:0};
    storyMap[sid].count++;
  });
  var storyKeys=Object.keys(storyMap);

  // Filter entries
  var entries=currentFilter==="all"?allEntries:allEntries.filter(function(e){return(e.storyId||e.storyTitle||"Unknown")===currentFilter;});

  if(allEntries.length===0){
    var emptyHtml='<div class="empty">';
    if(LB_HERO_IMAGE)emptyHtml+='<div class="empty-img"><img src="'+LB_HERO_IMAGE+'" alt="" /></div>';
    emptyHtml+='<h2>NO SCORES YET</h2><p>Complete a quest to see your name here.</p><a href="index.html" class="play-btn">Play Now</a></div>';
    el.innerHTML=emptyHtml;return;
  }

  entries.sort(function(a,b){return b.score-a.score||new Date(a.date)-new Date(b.date);});
  var html="";

  // Hero banner
  if(LB_HERO_IMAGE){html+='<div class="hero-banner"><img src="'+LB_HERO_IMAGE+'" alt="" />';if(LB_TAGLINE)html+='<div class="hero-tagline">'+LB_TAGLINE+'</div>';html+='</div>';}

  // Story filter tabs (only if multiple stories)
  if(storyKeys.length>1){
    html+='<div class="story-tabs">';
    html+='<button class="story-tab'+(currentFilter==="all"?" active":"")+'" onclick="setFilter(\'all\')">All Stories<span class="tab-count">('+allEntries.length+')</span></button>';
    storyKeys.forEach(function(sid){
      var s=storyMap[sid];
      html+='<button class="story-tab'+(currentFilter===sid?" active":"")+'" onclick="setFilter(\''+sid.replace(/'/g,"\\'")+'\')">'+esc(s.title)+'<span class="tab-count">('+s.count+')</span></button>';
    });
    html+='</div>';
  }

  // Stats
  var totalPlays=entries.length;
  if(totalPlays===0){html+='<div class="empty"><h2>NO SCORES</h2><p>No one has completed this story yet.</p></div>';el.innerHTML=html;return;}
  var avgScore=Math.round(entries.reduce(function(s,e){return s+(e.score||0);},0)/totalPlays);
  var highScore=entries[0].score||0;
  var uniquePlayers=[];entries.forEach(function(e){if(uniquePlayers.indexOf(e.name)===-1)uniquePlayers.push(e.name);});
  html+='<div class="stats-row">';
  html+='<div class="stat-card"><div class="stat-val">'+totalPlays+'</div><div class="stat-label">Total Plays</div></div>';
  html+='<div class="stat-card"><div class="stat-val">'+uniquePlayers.length+'</div><div class="stat-label">Players</div></div>';
  html+='<div class="stat-card"><div class="stat-val">'+highScore+'</div><div class="stat-label">High Score</div></div>';
  html+='<div class="stat-card"><div class="stat-val">'+avgScore+'</div><div class="stat-label">Avg Score</div></div>';
  html+='</div>';

  // Podium
  if(entries.length>=3){
    var t=entries.slice(0,3);
    html+='<div class="podium">';
    html+='<div class="podium-item silver"><div class="podium-bar"><div class="podium-rank">2ND</div><div class="podium-name">'+esc(t[1].name)+'</div><div class="podium-dept">'+esc(t[1].dept||"")+'</div><div class="podium-score">'+t[1].score+'</div>'+(currentFilter==="all"&&t[1].storyTitle?'<div class="podium-story">'+esc(t[1].storyTitle)+'</div>':"")+'</div><div class="podium-base">Silver</div></div>';
    html+='<div class="podium-item gold"><div class="podium-bar"><div class="podium-rank">1ST</div><div class="podium-name">'+esc(t[0].name)+'</div><div class="podium-dept">'+esc(t[0].dept||"")+'</div><div class="podium-score">'+t[0].score+'</div>'+(currentFilter==="all"&&t[0].storyTitle?'<div class="podium-story">'+esc(t[0].storyTitle)+'</div>':"")+'</div><div class="podium-base">Gold</div></div>';
    html+='<div class="podium-item bronze"><div class="podium-bar"><div class="podium-rank">3RD</div><div class="podium-name">'+esc(t[2].name)+'</div><div class="podium-dept">'+esc(t[2].dept||"")+'</div><div class="podium-score">'+t[2].score+'</div>'+(currentFilter==="all"&&t[2].storyTitle?'<div class="podium-story">'+esc(t[2].storyTitle)+'</div>':"")+'</div><div class="podium-base">Bronze</div></div>';
    html+='</div>';
  }

  // Table
  var showStoryCol=currentFilter==="all"&&storyKeys.length>1;
  html+='<div class="lb-card">';
  html+='<div class="lb-header"><span class="col-rank">#</span><span class="col-name">Player</span><span class="col-dept">Department</span>'+(showStoryCol?'<span class="col-story">Story</span>':'')+'<span class="col-ending">Ending</span><span class="col-score">Score</span></div>';
  entries.forEach(function(entry,i){
    html+='<div class="lb-row'+(i<3?" highlight":"")+'">';
    html+='<span class="col-rank">'+(i+1)+'</span>';
    html+='<span class="col-name">'+esc(entry.name)+'</span>';
    html+='<span class="col-dept">'+esc(entry.dept||"\u2014")+'</span>';
    if(showStoryCol)html+='<span class="col-story">'+esc(entry.storyTitle||"\u2014")+'</span>';
    html+='<span class="col-ending">'+esc(entry.ending||entry.endingType||"\u2014")+'</span>';
    html+='<span class="col-score">'+(entry.score||0)+'</span>';
    html+='</div>';
  });
  html+='</div>';

  // Actions
  html+='<div class="action-row">';
  html+='<a href="index.html" class="action-btn outline">Play Again</a>';
  html+='<button class="action-btn outline" onclick="doExportCSV()">Export CSV</button>';
  html+='<button class="action-btn danger" onclick="doClearBoard()">Clear Local Scores</button>';
  html+='</div>';
  el.innerHTML=html;
}

function setFilter(f){currentFilter=f;render();}
function esc(str){var d=document.createElement("div");d.textContent=str||"";return d.innerHTML;}

function doExportCSV(){
  loadEntries(function(entries){
    if(!entries.length)return;
    entries.sort(function(a,b){return b.score-a.score;});
    var rows=["Name,Department,Story,Score,Strategy,Stakeholders,Significance,Reach,Evidence,Ending,Steps,Date"];
    entries.forEach(function(e){
      var s=e.scores||{};
      rows.push(['"'+(e.name||"").replace(/"/g,'""')+'"','"'+(e.dept||"").replace(/"/g,'""')+'"','"'+(e.storyTitle||"").replace(/"/g,'""')+'"',e.score||0,s.strategy||0,s.stakeholders||0,s.significance||0,s.reach||0,s.evidence||0,'"'+(e.ending||e.endingType||"").replace(/"/g,'""')+'"',e.steps||0,'"'+(e.date||"")+'"'].join(","));
    });
    var blob=new Blob([rows.join("\n")],{type:"text/csv"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="impact-quest-leaderboard.csv";document.body.appendChild(a);a.click();document.body.removeChild(a);
  });
}
function doClearBoard(){if(confirm("Clear local leaderboard data?")){localStorage.removeItem("iq_leaderboard");render();}}
render();
</script>
</body>
</html>
