<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Impact Quest — A Research Impact Adventure</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f0e8;--surface:#ffffff;--surface-hover:#ede8da;--border:#d8d2c4;
  --text-primary:#0f0e0d;--text-secondary:#4a4540;--text-muted:#8c8272;
  --bar-bg:#ede8da;--accent:#e8963a;--accent-dark:#c4782a;--accent-glow:rgba(232,150,58,0.12);
  --ink:#0f0e0d;--sage:#4a6741;--rust:#c0392b;
}
body{background:var(--bg);color:var(--text-primary);font-family:'DM Sans',sans-serif;min-height:100vh;padding:20px}
.container{max-width:720px;margin:0 auto}
.header{text-align:center;margin-bottom:32px;padding-top:20px}
.header-label{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--accent-dark);margin-bottom:8px;font-weight:600}
.header h1{font-family:'Bebas Neue',sans-serif;font-size:52px;font-weight:400;color:var(--ink);letter-spacing:4px;line-height:0.95}
.header h1 em{font-style:normal;color:var(--accent)}
.header-meta{font-size:12px;color:var(--text-muted);margin-top:8px}
.dashboard{background:var(--surface);border-radius:3px;padding:16px 20px;margin-bottom:24px;border:1px solid var(--border)}
.dashboard-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.dashboard-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--text-muted)}
.dashboard-total{font-size:13px;font-weight:700;color:var(--accent-dark);background:var(--accent-glow);padding:4px 12px;border-radius:3px}
.score-row{margin-bottom:10px}
.score-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;color:var(--text-secondary)}
.score-label .val{font-weight:600}
.score-track{height:8px;border-radius:3px;background:var(--bar-bg);overflow:hidden}
.score-fill{height:100%;border-radius:3px;transition:width 0.8s cubic-bezier(0.4,0,0.2,1)}
.content-card{background:var(--surface);border-radius:3px;padding:28px 24px;margin-bottom:24px;border:1px solid var(--border);position:relative;overflow:hidden;opacity:0;animation:fadeIn 0.4s ease forwards}
.content-card.ending{border-width:2px}
.content-card .top-line{position:absolute;top:0;left:0;right:0;height:3px}
.content-title-row{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.content-title-row .emoji{font-size:28px}
.content-title{font-family:'Bebas Neue',sans-serif;font-size:28px;font-weight:400;letter-spacing:2px;color:var(--ink)}
.content-title.ending{font-size:32px}
.narrative{font-size:15px;line-height:1.75;color:var(--text-secondary)}
.narrative p{margin-bottom:12px}
.skip-hint{font-size:11px;color:var(--text-muted);font-style:italic;margin-top:8px;cursor:pointer}
.choices-section{display:flex;flex-direction:column;gap:10px;margin-bottom:32px}
.choices-label{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--accent-dark);font-weight:700;margin-bottom:4px}
.choice-btn{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:14px 20px;cursor:pointer;text-align:left;color:var(--text-primary);font-size:14px;font-family:'DM Sans',sans-serif;line-height:1.5;transition:all 0.2s ease;display:flex;align-items:center;gap:14px}
.choice-btn:hover{background:var(--surface-hover);border-color:var(--accent)}
.choice-letter{min-width:28px;height:28px;border-radius:50%;background:var(--bar-bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text-muted);transition:all 0.2s ease;flex-shrink:0}
.choice-btn:hover .choice-letter{background:var(--accent);color:var(--ink)}
.ending-box{background:var(--surface);border-radius:3px;padding:24px;border:1px solid var(--border);text-align:center;margin-bottom:32px}
.ending-score-label{font-size:14px;color:var(--text-secondary);margin-bottom:16px}
.ending-score-val{font-size:36px;font-weight:400;color:var(--accent-dark);font-family:'Bebas Neue',sans-serif;letter-spacing:2px}
.ending-summary{font-size:13px;color:var(--text-muted);margin-bottom:20px}
.action-btn{border:none;border-radius:3px;padding:12px 24px;cursor:pointer;font-size:13px;font-weight:700;font-family:'DM Sans',sans-serif;letter-spacing:0.05em;text-transform:uppercase;transition:all 0.2s ease;text-decoration:none;display:inline-block}
.action-btn.primary{background:var(--accent);color:var(--ink)}
.action-btn.primary:hover{background:var(--accent-dark)}
.action-btn.dark{background:var(--ink);color:var(--bg)}
.action-btn.dark:hover{background:#2a2826}
.action-btn.outline{background:none;border:1px solid var(--border);color:var(--text-secondary)}
.action-btn.outline:hover{border-color:var(--accent);color:var(--accent-dark)}
.restart-small-btn{background:none;border:1px solid var(--border);border-radius:3px;padding:6px 16px;cursor:pointer;color:var(--text-muted);font-size:11px;font-weight:600;font-family:'DM Sans',sans-serif;letter-spacing:0.05em;text-transform:uppercase;transition:all 0.2s ease;margin-top:10px}
.restart-small-btn:hover{border-color:var(--accent);color:var(--accent-dark)}
.journey-log{margin-bottom:32px}
.journey-log summary{cursor:pointer;font-size:11px;color:var(--text-muted);letter-spacing:2px;text-transform:uppercase;font-weight:700;padding:8px 0}
.journey-step{padding:8px 16px;margin-bottom:8px;font-size:13px;color:var(--text-secondary);border-left:2px solid var(--border)}
.journey-step .step-title{font-weight:600;color:var(--text-primary);margin-bottom:2px}
.loading{text-align:center;padding:80px 20px;color:var(--text-muted);font-size:14px}
.loading .spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:16px}
.scene-img{border-radius:3px;margin-bottom:16px}
.reg-card{background:var(--surface);border-radius:3px;padding:32px;border:1px solid var(--border);max-width:440px;margin:0 auto}
.reg-card h2{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--ink);margin-bottom:4px}
.reg-card p{font-size:13px;color:var(--text-muted);margin-bottom:20px;line-height:1.6}
.reg-label{display:block;font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:5px}
.reg-input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text-primary);padding:10px 12px;border-radius:3px;font-size:14px;font-family:'DM Sans',sans-serif;margin-bottom:16px;outline:none}
.reg-input:focus{border-color:var(--accent)}
.reg-btn{background:var(--accent);border:none;border-radius:3px;padding:12px 32px;cursor:pointer;color:var(--ink);font-size:13px;font-weight:700;font-family:'DM Sans',sans-serif;letter-spacing:0.05em;text-transform:uppercase;width:100%;transition:background 0.2s}
.reg-btn:hover{background:var(--accent-dark)}
.reg-btn:disabled{opacity:0.4;cursor:default}
.lb-link{display:inline-block;margin-top:16px;font-size:12px;color:var(--accent-dark);text-decoration:none;font-weight:600;letter-spacing:0.05em;text-transform:uppercase}
.lb-link:hover{color:var(--accent)}
.submitted-badge{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:3px;padding:8px 16px;font-size:12px;color:var(--sage);margin-bottom:16px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><div class="container"><div class="loading"><div class="spinner"></div><div>Loading The Impact Quest...</div></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
var e=React.createElement,useState=React.useState,useEffect=React.useEffect,useRef=React.useRef,useCallback=React.useCallback;
var SCORE_LABELS={strategy:"Strategic Thinking",stakeholders:"Stakeholder Relations",significance:"Significance",reach:"Reach",evidence:"Evidence Quality"};
var SCORE_COLORS={strategy:"#E8A838",stakeholders:"#4a6741",significance:"#c0392b",reach:"#5b7fb5",evidence:"#96CEB4"};
var ENDING_THEMES={policy:{emoji:"\ud83c\udfdb\ufe0f",color:"#5b7fb5"},practitioner:{emoji:"\ud83e\udd1d",color:"#4a6741"},cycle:{emoji:"\ud83d\udd04",color:"#e8963a"}};

var LB_REPO = "paulbrbeal/Impact-Quest";
var LB_TOKEN = "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"; // Replace with your GitHub personal access token

function saveScore(entry, onDone){
  // Always save locally
  try{var l=JSON.parse(localStorage.getItem("iq_leaderboard")||"[]");l.push(entry);localStorage.setItem("iq_leaderboard",JSON.stringify(l));}catch(e){}

  // Use hardcoded token, or fall back to editor's saved token
  var token = (LB_TOKEN !== "PASTE_YOUR_TOKEN_HERE" ? LB_TOKEN : (localStorage.getItem("iq_gh_token")||"")).replace(/[^\x20-\x7E]/g,"").trim();
  if(!token){if(onDone)onDone("local");return;}

  var apiUrl = "https://api.github.com/repos/" + LB_REPO + "/contents/leaderboard.json";
  fetch(apiUrl, {headers:{"Authorization":"Bearer "+token}})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(existing){
      var entries=[];
      if(existing&&existing.content){
        try{entries=JSON.parse(atob(existing.content.replace(/\n/g,"")));}catch(e){entries=[];}
      }
      entries.push(entry);
      var base64=btoa(unescape(encodeURIComponent(JSON.stringify(entries,null,2))));
      var body={message:"Leaderboard: "+entry.name+" scored "+entry.score,content:base64};
      if(existing&&existing.sha)body.sha=existing.sha;
      return fetch(apiUrl,{method:"PUT",headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify(body)});
    })
    .then(function(r){if(onDone)onDone(r&&r.ok?"github":"local");})
    .catch(function(){if(onDone)onDone("local");});
}

function TypewriterText(props){var text=props.text,speed=props.speed,onComplete=props.onComplete;var _d=useState(""),displayed=_d[0],setDisplayed=_d[1];var _dn=useState(false),done=_dn[0],setDone=_dn[1];var idx=useRef(0),timer=useRef(null);useEffect(function(){idx.current=0;setDisplayed("");setDone(false);function tick(){idx.current++;setDisplayed(text.slice(0,idx.current));if(idx.current>=text.length){setDone(true);if(onComplete)onComplete();}else{timer.current=setTimeout(tick,speed||8);}}timer.current=setTimeout(tick,speed||8);return function(){clearTimeout(timer.current);};},[text]);var handleSkip=function(){clearTimeout(timer.current);setDisplayed(text);setDone(true);if(onComplete)onComplete();};var pars=displayed.split("\n").map(function(line,i){return e("p",{key:i,style:{margin:"0 0 12px 0",minHeight:line===""?12:"auto"}},line);});return e("div",{onClick:!done?handleSkip:undefined,style:{cursor:done?"default":"pointer"}},pars,!done?e("div",{className:"skip-hint"},"Click to skip animation"):null);}
function ScoreBar(props){var pct=Math.min((props.value/props.max)*100,100);return e("div",{className:"score-row"},e("div",{className:"score-label"},e("span",null,props.label),e("span",{className:"val",style:{color:props.color}},props.value)),e("div",{className:"score-track"},e("div",{className:"score-fill",style:{width:pct+"%",background:props.color}})));}

function RegScreen(props){
  var _n=useState(""),name=_n[0],setName=_n[1];
  var _d=useState(""),dept=_d[0],setDept=_d[1];
  var canStart=name.trim().length>0;
  var handleKey=function(ev){if(ev.key==="Enter"&&canStart)props.onStart(name.trim(),dept.trim());};
  return e("div",{className:"container"},
    e("div",{className:"header"},e("div",{className:"header-label"},"A Research Impact Adventure"),e("h1",null,"THE ",e("em",null,"IMPACT")," QUEST")),
    e("div",{className:"reg-card"},
      e("h2",null,"BEFORE YOU BEGIN"),
      e("p",null,"Enter your details below. Your name will appear on the leaderboard when you complete the quest."),
      e("label",{className:"reg-label"},"Your Name *"),
      e("input",{className:"reg-input",value:name,onChange:function(ev){setName(ev.target.value);},onKeyDown:handleKey,placeholder:"e.g. Alex Chen",autoFocus:true}),
      e("label",{className:"reg-label"},"Department / School"),
      e("input",{className:"reg-input",value:dept,onChange:function(ev){setDept(ev.target.value);},onKeyDown:handleKey,placeholder:"e.g. Psychology, Computer Science"}),
      e("button",{className:"reg-btn",disabled:!canStart,onClick:function(){props.onStart(name.trim(),dept.trim());}},"Start the Quest"),
      e("a",{className:"lb-link",href:"leaderboard.html"},"\u2192 View Leaderboard")
    )
  );
}

function App(props){
  var GAME_DATA=props.data;
  var _phase=useState("register"),phase=_phase[0],setPhase=_phase[1];
  var _player=useState({name:"",dept:""}),player=_player[0],setPlayer=_player[1];
  var _cn=useState("start"),currentNode=_cn[0],setCurrentNode=_cn[1];
  var _sc=useState({strategy:0,stakeholders:0,significance:0,reach:0,evidence:0}),scores=_sc[0],setScores=_sc[1];
  var _hi=useState([]),history=_hi[0],setHistory=_hi[1];
  var _sh=useState(false),showChoices=_sh[0],setShowChoices=_sh[1];
  var _ck=useState(0),cardKey=_ck[0],setCardKey=_ck[1];
  var _sub=useState(false),submitted=_sub[0],setSubmitted=_sub[1];

  if(phase==="register")return e(RegScreen,{onStart:function(n,d){setPlayer({name:n,dept:d});setPhase("playing");}});

  var node=GAME_DATA[currentNode];
  var maxScore=Math.max(50,Math.max.apply(null,Object.values(scores)));
  var totalScore=Object.values(scores).reduce(function(a,b){return a+b;},0);
  var endTheme=node.isEnding?ENDING_THEMES[node.endingType]:null;

  var handleChoice=function(choice){
    setShowChoices(false);
    setHistory(function(h){return h.concat([{node:currentNode,choice:choice.text}]);});
    var nextNode=GAME_DATA[choice.next];
    if(nextNode&&nextNode.scoreEffect){setScores(function(s){var ns=Object.assign({},s);Object.keys(nextNode.scoreEffect).forEach(function(k){ns[k]=Math.max(0,(ns[k]||0)+nextNode.scoreEffect[k]);});return ns;});}
    setCurrentNode(choice.next);setCardKey(function(k){return k+1;});window.scrollTo({top:0,behavior:"smooth"});
  };
  var restart=function(){setCurrentNode("start");setScores({strategy:0,stakeholders:0,significance:0,reach:0,evidence:0});setHistory([]);setShowChoices(false);setSubmitted(false);setCardKey(function(k){return k+1;});window.scrollTo({top:0,behavior:"smooth"});};
  var restartFull=function(){setPhase("register");restart();};

  // Submit score on ending
  useEffect(function(){
    if(node.isEnding&&!submitted&&showChoices){
      var entry={name:player.name,dept:player.dept,score:totalScore,scores:Object.assign({},scores),ending:node.title,endingType:node.endingType||"unknown",steps:history.length,date:new Date().toISOString()};
      saveScore(entry);
      setSubmitted(true);
    }
  },[node.isEnding,submitted,showChoices]);

  return e("div",{className:"container"},
    e("div",{className:"header"},
      e("div",{className:"header-label"},"A Research Impact Adventure"),
      e("h1",null,"THE ",e("em",null,"IMPACT")," QUEST"),
      e("div",{className:"header-meta",style:{marginTop:8}},"Playing as ",e("strong",null,player.name),player.dept?" \u00b7 "+player.dept:""),
      currentNode!=="start"?e("div",{className:"header-meta"},"Chapter "+(history.length+1)+" \u00b7 Decisions made: "+history.length):null,
      currentNode!=="start"?e("button",{className:"restart-small-btn",onClick:restart},"\u2190 Start Again"):null
    ),
    currentNode!=="start"?e("div",{className:"dashboard"},
      e("div",{className:"dashboard-header"},e("span",{className:"dashboard-title"},"Impact Dashboard"),e("span",{className:"dashboard-total"},"Total: "+totalScore)),
      Object.keys(SCORE_LABELS).map(function(key){return e(ScoreBar,{key:key,label:SCORE_LABELS[key],value:scores[key],max:maxScore,color:SCORE_COLORS[key]});})
    ):null,
    e("div",{key:cardKey,className:"content-card"+(node.isEnding?" ending":""),style:node.isEnding?{borderColor:endTheme.color}:{}},
      node.isEnding?e("div",{className:"top-line",style:{background:"linear-gradient(90deg, "+endTheme.color+", transparent)"}}):null,
      e("div",{className:"content-title-row"},node.isEnding?e("span",{className:"emoji"},endTheme.emoji):null,e("h2",{className:"content-title"+(node.isEnding?" ending":""),style:node.isEnding?{color:endTheme.color}:{}},node.title)),
      node.image?e("div",{style:{textAlign:"center",marginBottom:"16px"}},e("img",{src:node.image,alt:"",className:"scene-img",style:{width:node.imageSize==="small"?"40%":node.imageSize==="medium"?"65%":"100%",maxHeight:node.imageSize==="banner"?"150px":"300px",objectFit:"cover"}})):null,
      e("div",{className:"narrative"},e(TypewriterText,{key:currentNode,text:node.narrative,speed:8,onComplete:function(){setShowChoices(true);}}))
    ),
    !node.isEnding&&showChoices&&node.choices?e("div",{className:"choices-section"},
      e("div",{className:"choices-label"},"What do you do?"),
      node.choices.map(function(choice,i){return e("button",{key:i,className:"choice-btn",onClick:function(){handleChoice(choice);}},e("span",{className:"choice-letter"},String.fromCharCode(65+i)),choice.text);})
    ):null,
    node.isEnding&&showChoices?e("div",{className:"ending-box"},
      submitted?e("div",{className:"submitted-badge"},"\u2713 Score submitted to leaderboard"):null,
      e("div",{className:"ending-score-label"},"Final Score: ",e("span",{className:"ending-score-val"},totalScore)),
      e("div",{className:"ending-summary"},player.name+" \u2014 you made "+history.length+" decisions."+(totalScore>=80?" Outstanding!":totalScore>=50?" Strong foundations.":" Try different choices next time!")),
      e("div",{style:{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}},
        e("button",{className:"action-btn primary",onClick:restart},"Play Again"),
        e("button",{className:"action-btn dark",onClick:restartFull},"New Player"),
        e("a",{className:"action-btn outline",href:"leaderboard.html"},"Leaderboard")
      )
    ):null,
    history.length>0&&showChoices?e("details",{className:"journey-log"},
      e("summary",null,"Your Journey ("+history.length+" steps)"),
      e("div",{style:{marginTop:12}},history.map(function(h,i){return e("div",{key:i,className:"journey-step",style:{borderLeftColor:SCORE_COLORS[Object.keys(SCORE_COLORS)[i%5]]}},e("div",{className:"step-title"},GAME_DATA[h.node]?GAME_DATA[h.node].title:""),"\u2192 "+h.choice);}))
    ):null
  );
}

fetch("game-data.json?t="+Date.now()).then(function(r){return r.json();}).then(function(data){ReactDOM.render(e(App,{data:data}),document.getElementById("app"));}).catch(function(err){document.getElementById("app").innerHTML='<div class="container" style="text-align:center;padding:80px 20px"><h2 style="color:var(--rust);margin-bottom:12px">Failed to load game data</h2><p style="color:var(--text-muted)">Make sure game-data.json is in the same folder.</p></div>';});
</script>
</body>
</html>
