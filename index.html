<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Impact Quest</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f0e8;--surface:#ffffff;--surface-hover:#ede8da;--border:#d8d2c4;
  --text:#0f0e0d;--text-sec:#4a4540;--text-muted:#8c8272;
  --bar-bg:#ede8da;--accent:#e8963a;--accent-dark:#c4782a;--accent-glow:rgba(232,150,58,0.12);
  --ink:#0f0e0d;--sage:#4a6741;--rust:#c0392b;--blue:#5b7fb5;
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding:20px}
.container{max-width:720px;margin:0 auto}
.wide-container{max-width:900px;margin:0 auto}
.header{text-align:center;margin-bottom:32px;padding-top:20px}
.header-label{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--accent-dark);margin-bottom:8px;font-weight:600}
.header h1{font-family:'Bebas Neue',sans-serif;font-size:52px;font-weight:400;color:var(--ink);letter-spacing:4px;line-height:0.95}
.header h1 em{font-style:normal;color:var(--accent)}
.header-meta{font-size:12px;color:var(--text-muted);margin-top:8px}

/* Story selection cards */
.story-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-bottom:32px}
.story-card{background:var(--surface);border:1px solid var(--border);border-radius:3px;overflow:hidden;cursor:pointer;transition:all 0.2s}
.story-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,0.08)}
.story-card-img{height:140px;background:var(--bar-bg);overflow:hidden}
.story-card-img img{width:100%;height:100%;object-fit:cover}
.story-card-body{padding:16px}
.story-card-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1.5px;color:var(--ink);margin-bottom:4px}
.story-card-desc{font-size:12px;color:var(--text-muted);line-height:1.5}
.story-card-meta{margin-top:8px;font-size:10px;color:var(--accent-dark);font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
.story-intro{text-align:center;margin-bottom:24px;font-size:13px;color:var(--text-muted);line-height:1.6}

/* Registration */
.reg-card{background:var(--surface);border-radius:3px;padding:32px;border:1px solid var(--border);max-width:440px;margin:0 auto}
.reg-card h2{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--ink);margin-bottom:4px}
.reg-card p{font-size:13px;color:var(--text-muted);margin-bottom:20px;line-height:1.6}
.reg-label{display:block;font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:5px}
.reg-input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:3px;font-size:14px;font-family:'DM Sans',sans-serif;margin-bottom:16px;outline:none}
.reg-input:focus{border-color:var(--accent)}
.reg-btn{background:var(--accent);border:none;border-radius:3px;padding:12px 32px;cursor:pointer;color:var(--ink);font-size:13px;font-weight:700;font-family:'DM Sans',sans-serif;letter-spacing:0.05em;text-transform:uppercase;width:100%;transition:background 0.2s}
.reg-btn:hover{background:var(--accent-dark)}.reg-btn:disabled{opacity:0.4;cursor:default}
.back-link{font-size:11px;color:var(--accent-dark);cursor:pointer;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;display:inline-block;margin-bottom:12px}
.back-link:hover{color:var(--accent)}

/* Game */
.dashboard{background:var(--surface);border-radius:3px;padding:16px 20px;margin-bottom:24px;border:1px solid var(--border)}
.dashboard-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.dashboard-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--text-muted)}
.dashboard-total{font-size:13px;font-weight:700;color:var(--accent-dark);background:var(--accent-glow);padding:4px 12px;border-radius:3px}
.score-row{margin-bottom:10px}
.score-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;color:var(--text-sec)}
.score-label .val{font-weight:600}
.score-track{height:8px;border-radius:3px;background:var(--bar-bg);overflow:hidden}
.score-fill{height:100%;border-radius:3px;transition:width 0.8s cubic-bezier(0.4,0,0.2,1)}
.content-card{background:var(--surface);border-radius:3px;padding:28px 24px;margin-bottom:24px;border:1px solid var(--border);position:relative;overflow:hidden;opacity:0;animation:fadeIn 0.4s ease forwards}
.content-card.ending{border-width:2px}
.content-card .top-line{position:absolute;top:0;left:0;right:0;height:3px}
.content-title-row{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.content-title-row .emoji{font-size:28px}
.content-title{font-family:'Bebas Neue',sans-serif;font-size:28px;font-weight:400;letter-spacing:2px;color:var(--ink)}
.content-title.ending{font-size:32px}
.narrative{font-size:15px;line-height:1.75;color:var(--text-sec)}
.narrative p{margin-bottom:12px}
.skip-hint{font-size:11px;color:var(--text-muted);font-style:italic;margin-top:8px;cursor:pointer}
.choices-section{display:flex;flex-direction:column;gap:10px;margin-bottom:32px}
.choices-label{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--accent-dark);font-weight:700;margin-bottom:4px}
.choice-btn{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:14px 20px;cursor:pointer;text-align:left;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;line-height:1.5;transition:all 0.2s;display:flex;align-items:center;gap:14px}
.choice-btn:hover{background:var(--surface-hover);border-color:var(--accent)}
.choice-letter{min-width:28px;height:28px;border-radius:50%;background:var(--bar-bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text-muted);transition:all 0.2s;flex-shrink:0}
.choice-btn:hover .choice-letter{background:var(--accent);color:var(--ink)}
.ending-box{background:var(--surface);border-radius:3px;padding:24px;border:1px solid var(--border);text-align:center;margin-bottom:32px}
.ending-score-label{font-size:14px;color:var(--text-sec);margin-bottom:16px}
.ending-score-val{font-size:36px;font-weight:400;color:var(--accent-dark);font-family:'Bebas Neue',sans-serif;letter-spacing:2px}
.ending-summary{font-size:13px;color:var(--text-muted);margin-bottom:20px}
.action-btn{border:none;border-radius:3px;padding:12px 24px;cursor:pointer;font-size:13px;font-weight:700;font-family:'DM Sans',sans-serif;letter-spacing:0.05em;text-transform:uppercase;transition:all 0.2s;text-decoration:none;display:inline-block}
.action-btn.primary{background:var(--accent);color:var(--ink)}.action-btn.primary:hover{background:var(--accent-dark)}
.action-btn.dark{background:var(--ink);color:var(--bg)}.action-btn.dark:hover{background:#2a2826}
.action-btn.outline{background:none;border:1px solid var(--border);color:var(--text-sec)}.action-btn.outline:hover{border-color:var(--accent);color:var(--accent-dark)}
.restart-small-btn{background:none;border:1px solid var(--border);border-radius:3px;padding:6px 16px;cursor:pointer;color:var(--text-muted);font-size:11px;font-weight:600;font-family:'DM Sans',sans-serif;letter-spacing:0.05em;text-transform:uppercase;transition:all 0.2s;margin-top:10px}
.restart-small-btn:hover{border-color:var(--accent);color:var(--accent-dark)}
.journey-log{margin-bottom:32px}
.journey-log summary{cursor:pointer;font-size:11px;color:var(--text-muted);letter-spacing:2px;text-transform:uppercase;font-weight:700;padding:8px 0}
.journey-step{padding:8px 16px;margin-bottom:8px;font-size:13px;color:var(--text-sec);border-left:2px solid var(--border)}
.journey-step .step-title{font-weight:600;color:var(--text);margin-bottom:2px}
.scene-img{border-radius:3px;margin-bottom:16px}
.submitted-badge{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:3px;padding:8px 16px;font-size:12px;color:var(--sage);margin-bottom:16px}
.lb-link{display:inline-block;margin-top:16px;font-size:12px;color:var(--accent-dark);text-decoration:none;font-weight:600;letter-spacing:0.05em;text-transform:uppercase}
.lb-link:hover{color:var(--accent)}
/* Tags & Badges */
.tag-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;padding:3px 8px;border-radius:2px;line-height:1}
.tag-cat{background:var(--bar-bg);color:var(--text-muted);border:1px solid var(--border)}
.tag-cat[data-cat="strategy"]{background:#fef3c7;color:#92400e;border-color:#fcd34d}
.tag-cat[data-cat="stakeholders"]{background:#d1fae5;color:#065f46;border-color:#6ee7b7}
.tag-cat[data-cat="significance"]{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
.tag-cat[data-cat="reach"]{background:#dbeafe;color:#1e40af;border-color:#93c5fd}
.tag-cat[data-cat="evidence"]{background:#d8efe0;color:#1f5c3d;border-color:#96CEB4}
.tag-impact{background:transparent;color:var(--text-muted);border:1px dashed var(--border);font-weight:500}
.tag-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.phase-indicator{display:inline-flex;align-items:center;gap:6px;font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-top:6px}
.phase-pip{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0}
.phase-pip.active{background:var(--accent);border-color:var(--accent)}
.phase-pip.past{background:var(--text-muted);border-color:var(--text-muted)}

/* Journey Analytics (ending screen) */
.analytics-card{background:var(--surface);border-radius:3px;padding:20px 24px;margin-bottom:24px;border:1px solid var(--border)}
.analytics-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:var(--ink);margin-bottom:16px}
.analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:500px){.analytics-grid{grid-template-columns:1fr}}
.analytics-section{margin-bottom:16px}
.analytics-section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin-bottom:8px}
.analytics-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.analytics-bar-label{font-size:11px;color:var(--text-sec);width:90px;text-align:right;flex-shrink:0}
.analytics-bar-track{flex:1;height:12px;border-radius:2px;background:var(--bar-bg);overflow:hidden;position:relative}
.analytics-bar-fill{height:100%;border-radius:2px;transition:width 1s ease}
.analytics-bar-val{font-size:10px;font-weight:700;width:24px;text-align:left;flex-shrink:0;color:var(--text-muted)}
.phase-timeline{display:flex;align-items:center;gap:2px;margin-top:8px}
.phase-block{height:20px;border-radius:2px;flex:1;position:relative;cursor:default}
.phase-block:hover::after{content:attr(data-label);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:9px;padding:2px 6px;border-radius:2px;white-space:nowrap;margin-bottom:4px}
/* IEO Overlay */
.ieo-btn{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:1.5px dashed var(--accent);border-radius:3px;padding:12px 16px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--accent-dark);font-weight:600;text-align:left;transition:all 0.2s;margin-top:8px}
.ieo-btn:hover{background:var(--accent-glow);border-style:solid}
.ieo-btn .ieo-icon{width:28px;height:28px;border-radius:50%;background:var(--accent-glow);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.ieo-panel{background:var(--surface);border:1.5px solid var(--accent);border-radius:3px;padding:20px 24px;margin-top:16px;animation:fadeIn 0.3s ease}
.ieo-panel-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ieo-panel-avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-glow);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.ieo-panel-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1.5px;color:var(--ink)}
.ieo-panel-close{margin-left:auto;background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:18px;padding:4px 8px}
.ieo-panel-close:hover{color:var(--ink)}
.ieo-panel-body{font-size:13px;color:var(--text-sec);line-height:1.7}
.ieo-panel-body p{margin-bottom:10px}
.ieo-panel-body strong{color:var(--ink)}
.ieo-tip{background:var(--accent-glow);border-left:3px solid var(--accent);padding:10px 14px;margin-top:12px;font-size:12px;color:var(--text-sec);line-height:1.6;border-radius:0 3px 3px 0}
.ieo-dismiss{background:var(--bar-bg);border:none;border-radius:3px;padding:8px 20px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;color:var(--text-sec);text-transform:uppercase;letter-spacing:0.5px;margin-top:14px;transition:all 0.15s}
.ieo-dismiss:hover{background:var(--border)}
.loading{text-align:center;padding:80px 20px;color:var(--text-muted);font-size:14px}
.loading .spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:16px}
.no-img-placeholder{height:140px;background:var(--bar-bg);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--border);letter-spacing:2px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><div class="container"><div class="loading"><div class="spinner"></div><div>Loading...</div></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>

<script>
var e=React.createElement,useState=React.useState,useEffect=React.useEffect,useRef=React.useRef;
var SCORE_LABELS={strategy:"Strategic Thinking",stakeholders:"Stakeholder Relations",significance:"Significance",reach:"Reach",evidence:"Evidence Quality"};
var SCORE_COLORS={strategy:"#E8A838",stakeholders:"#4a6741",significance:"#c0392b",reach:"#5b7fb5",evidence:"#96CEB4"};
var ENDING_THEMES={policy:{emoji:"\ud83c\udfdb\ufe0f",color:"#5b7fb5"},practitioner:{emoji:"\ud83e\udd1d",color:"#4a6741"},cycle:{emoji:"\ud83d\udd04",color:"#e8963a"}};
var CAT_LABELS={strategy:"Strategy",stakeholders:"Stakeholders",significance:"Significance",reach:"Reach",evidence:"Evidence"};
var IMPACT_LABELS={policy:"Policy",practice:"Practice",health:"Health",educational:"Educational",societal:"Societal",economic:"Economic",technological:"Technological"};
var IMPACT_COLORS={policy:"#5b7fb5",practice:"#4a6741",health:"#c0392b",educational:"#E8A838",societal:"#7c9885",economic:"#b08d57",technological:"#8b6f9e"};
var IMPACT_ICONS={policy:"\ud83c\udfdb",practice:"\ud83d\udee0",health:"\u2764\ufe0f",educational:"\ud83c\udf93",societal:"\ud83c\udf0d",economic:"\ud83d\udcb0",technological:"\u2699\ufe0f"};
var PHASE_ORDER=["planning","evidence","engagement","translation","adoption","scaling"];
var PHASE_LABELS={planning:"Planning",evidence:"Evidence",engagement:"Engagement",translation:"Translation",adoption:"Adoption",scaling:"Scaling"};
var PHASE_COLORS={planning:"#d4a017",evidence:"#7c9885",engagement:"#5b8c8c",translation:"#6a8caf",adoption:"#a86f6f",scaling:"#8b6f9e"};

var LB_REPO="paulbrbeal/Impact-Quest";

function saveScore(entry){
  // Only un-hide THIS entry (don't wipe the whole hidden list, or cleared ghosts reappear)
  try{
    var key=entry.name+"|"+(entry.date||"")+"|"+(entry.score||0);
    var hidden=JSON.parse(localStorage.getItem("iq_lb_hidden")||"[]");
    hidden=hidden.filter(function(h){return h!==key;});
    localStorage.setItem("iq_lb_hidden",JSON.stringify(hidden));
  }catch(e){}
  try{var l=JSON.parse(localStorage.getItem("iq_leaderboard")||"[]");l.push(entry);localStorage.setItem("iq_leaderboard",JSON.stringify(l));}catch(err){}
  var token=(localStorage.getItem("iq_gh_token")||"").replace(/[^\x20-\x7E]/g,"").trim();
  if(!token)return;
  var apiUrl="https://api.github.com/repos/"+LB_REPO+"/contents/leaderboard.json";
  fetch(apiUrl,{headers:{"Authorization":"Bearer "+token}}).then(function(r){return r.ok?r.json():null;}).then(function(existing){
    var entries=[];if(existing&&existing.content){try{entries=JSON.parse(atob(existing.content.replace(/\n/g,"")));}catch(e){}}
    entries.push(entry);var b64=btoa(unescape(encodeURIComponent(JSON.stringify(entries,null,2))));
    var body={message:"Score: "+entry.name+" ("+entry.storyTitle+")",content:b64};if(existing&&existing.sha)body.sha=existing.sha;
    return fetch(apiUrl,{method:"PUT",headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify(body)});
  }).catch(function(){});
}

function TypewriterText(props){var text=props.text,speed=props.speed,onComplete=props.onComplete;var _d=useState(""),displayed=_d[0],setDisplayed=_d[1];var _dn=useState(false),done=_dn[0],setDone=_dn[1];var idx=useRef(0),timer=useRef(null);useEffect(function(){idx.current=0;setDisplayed("");setDone(false);function tick(){idx.current++;setDisplayed(text.slice(0,idx.current));if(idx.current>=text.length){setDone(true);if(onComplete)onComplete();}else{timer.current=setTimeout(tick,speed||8);}}timer.current=setTimeout(tick,speed||8);return function(){clearTimeout(timer.current);};},[text]);var handleSkip=function(){clearTimeout(timer.current);setDisplayed(text);setDone(true);if(onComplete)onComplete();};var pars=displayed.split("\n").map(function(line,i){return e("p",{key:i,style:{margin:"0 0 12px 0",minHeight:line===""?12:"auto"}},line);});return e("div",{onClick:!done?handleSkip:undefined,style:{cursor:done?"default":"pointer"}},pars,!done?e("div",{className:"skip-hint"},"Click to skip animation"):null);}
function ScoreBar(props){var pct=Math.min((props.value/props.max)*100,100);return e("div",{className:"score-row"},e("div",{className:"score-label"},e("span",null,props.label),e("span",{className:"val",style:{color:props.color}},props.value)),e("div",{className:"score-track"},e("div",{className:"score-fill",style:{width:pct+"%",background:props.color}})));}

function SceneTags(props){
  var node=props.node;
  if(!node||(!node.categories&&!node.impactTypes))return null;
  var cats=(node.categories||[]);
  var impacts=(node.impactTypes||[]);
  return e("div",{className:"tag-row"},
    cats.map(function(c){return e("span",{key:"c-"+c,className:"tag tag-cat","data-cat":c},CAT_LABELS[c]||c);}),
    impacts.map(function(t){return e("span",{key:"i-"+t,className:"tag tag-impact"},IMPACT_ICONS[t]||"","\u2009",IMPACT_LABELS[t]||t);})
  );
}

function getIEOAdvice(node, scores, history, scenes, ieoData) {
  var cats = node.categories || [];
  var phase = node.phase || "engagement";
  var stepCount = history.length;
  var adv = ieoData || {};
  var greetings = adv.greetings || {};
  var phaseAdv = adv.phaseAdvice || {};
  var catTips = adv.categoryTips || {};
  var nudges = adv.scoreNudges || {};
  var closings = adv.closingLines || [];
  
  // Pick greeting based on progress
  var greeting = "";
  if (stepCount === 0) greeting = greetings.start || "Good to see you before you dive in.";
  else if (stepCount <= 2) greeting = greetings.early || "You\u2019re just getting started.";
  else if (stepCount <= 5) greeting = greetings.mid || "You\u2019re building momentum.";
  else greeting = greetings.late || "You\u2019ve made quite a few decisions. Let\u2019s take stock.";
  
  // Phase advice
  var phaseText = phaseAdv[phase] || phaseAdv.engagement || "Think about where you are in the impact journey and what the logical next step is.";
  
  // Score nudge
  var sortedScores = Object.entries(scores).sort(function(a,b){return a[1]-b[1];});
  var weakest = sortedScores[0];
  var strongest = sortedScores[sortedScores.length - 1];
  var scoreNudge = "";
  if (stepCount >= 3) {
    if (weakest[1] === 0 && strongest[1] > 10) {
      scoreNudge = (nudges.zeroGap || "Your {weak} is at zero while {strong} is strong. Consider addressing that gap.")
        .replace("{weak}", SCORE_LABELS[weakest[0]]).replace("{strong}", SCORE_LABELS[strongest[0]]);
    } else if (weakest[1] < strongest[1] * 0.3 && strongest[1] > 5) {
      scoreNudge = (nudges.lowGap || "Your {strong} is strong but {weak} could use attention.")
        .replace("{weak}", SCORE_LABELS[weakest[0]]).replace("{strong}", SCORE_LABELS[strongest[0]]);
    } else if (strongest[1] > 0 && weakest[1] >= strongest[1] * 0.5) {
      scoreNudge = nudges.balanced || "";
    }
  }
  
  // Category tip - pick one relevant to weakest dimension
  var relevantTip = "";
  if (cats.length > 0) {
    var tipCat = cats.indexOf(weakest[0]) >= 0 ? weakest[0] : cats[0];
    relevantTip = catTips[tipCat] || "";

  // Random closing line
  var closing = closings.length > 0 ? closings[Math.floor(Math.random() * closings.length)] : "";

    greeting: greeting,

function JourneyAnalytics(props){
  var history=props.history;var scenes=props.scenes;
  if(!history||history.length===0)return null;

  // Count categories across journey
  var catCounts={};var impactCounts={};var phaseCounts={};
  var phaseSequence=[];
  history.forEach(function(h){
    var sc=scenes[h.node];if(!sc)return;
    (sc.categories||[]).forEach(function(c){catCounts[c]=(catCounts[c]||0)+1;});
    (sc.impactTypes||[]).forEach(function(t){impactCounts[t]=(impactCounts[t]||0)+1;});
    var p=sc.phase||"engagement";phaseCounts[p]=(phaseCounts[p]||0)+1;
    phaseSequence.push(p);
  });
  // Add current ending node
  if(props.currentNode&&scenes[props.currentNode]){
    var endSc=scenes[props.currentNode];
    (endSc.categories||[]).forEach(function(c){catCounts[c]=(catCounts[c]||0)+1;});
    (endSc.impactTypes||[]).forEach(function(t){impactCounts[t]=(impactCounts[t]||0)+1;});
    var ep=endSc.phase||"scaling";phaseCounts[ep]=(phaseCounts[ep]||0)+1;
    phaseSequence.push(ep);
  }

  var maxCat=Math.max(1,Math.max.apply(null,Object.values(catCounts).concat([1])));
  var maxImpact=Math.max(1,Math.max.apply(null,Object.values(impactCounts).concat([1])));

  // Determine dominant category and impact
  var topCat=Object.entries(catCounts).sort(function(a,b){return b[1]-a[1];})[0];
  var topImpact=Object.entries(impactCounts).sort(function(a,b){return b[1]-a[1];})[0];

  return e("div",{className:"analytics-card"},
    e("div",{className:"analytics-title"},"Journey Analytics"),
    e("div",{className:"analytics-grid"},
      e("div",{className:"analytics-section"},
        e("div",{className:"analytics-section-title"},"REF Dimensions"),
        Object.keys(CAT_LABELS).map(function(key){
          var val=catCounts[key]||0;
          var pct=Math.round((val/maxCat)*100);
          return e("div",{key:key,className:"analytics-bar-row"},
            e("span",{className:"analytics-bar-label"},CAT_LABELS[key]),
            e("div",{className:"analytics-bar-track"},e("div",{className:"analytics-bar-fill",style:{width:pct+"%",background:SCORE_COLORS[key]||"#ccc"}})),
            e("span",{className:"analytics-bar-val"},val)
          );
        })
      ),
      e("div",{className:"analytics-section"},
        e("div",{className:"analytics-section-title"},"Impact Types"),
        Object.keys(IMPACT_LABELS).filter(function(k){return impactCounts[k];}).sort(function(a,b){return (impactCounts[b]||0)-(impactCounts[a]||0);}).map(function(key){
          var val=impactCounts[key]||0;
          var pct=Math.round((val/maxImpact)*100);
          return e("div",{key:key,className:"analytics-bar-row"},
            e("span",{className:"analytics-bar-label"},IMPACT_ICONS[key]||""," ",IMPACT_LABELS[key]),
            e("div",{className:"analytics-bar-track"},e("div",{className:"analytics-bar-fill",style:{width:pct+"%",background:IMPACT_COLORS[key]||"#8c8272"}})),
            e("span",{className:"analytics-bar-val"},val)
          );
        })
      )
    ),
    e("div",{className:"analytics-section"},
      e("div",{className:"analytics-section-title"},"Your Impact Journey"),
      e("div",{className:"phase-timeline"},
        phaseSequence.map(function(p,i){
          return e("div",{key:i,className:"phase-block","data-label":(i+1)+". "+PHASE_LABELS[p],style:{background:PHASE_COLORS[p]||"#ccc"}});
        })
      ),
      e("div",{style:{display:"flex",justifyContent:"space-between",marginTop:6}},
        e("span",{style:{fontSize:9,color:"var(--text-muted)"}},"\u2190 Start"),
        e("span",{style:{fontSize:9,color:"var(--text-muted)"}},"Ending \u2192")
      )
    ),
    topCat&&topImpact?e("div",{style:{marginTop:12,padding:"10px 14px",background:"var(--bar-bg)",borderRadius:3,fontSize:12,color:"var(--text-sec)",lineHeight:1.6}},
      "Your journey focused on ",e("strong",null,CAT_LABELS[topCat[0]]),
      " (",topCat[1]," scenes) with primarily ",
      e("strong",null,IMPACT_LABELS[topImpact[0]])," impact (",topImpact[1]," scenes).",
      phaseSequence.length>3?" You moved through "+Object.keys(phaseCounts).length+" phases of impact development.":""
    ):null
  );
}
